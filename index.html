    <script>
      (function () {
        if (window.__chicLocalImageFallbackReady) return;
        window.__chicLocalImageFallbackReady = true;

        var localImageExts = ["jpg", "jpeg", "png", "webp"];
        var imageFallbackSvg =
          "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect width=%22200%22 height=%22200%22 fill=%22%23fef2f5%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2240%22%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E";

        function localImageCandidates(src) {
          var cleanSrc = String(src || "")
            .split("#")[0]
            .split("?")[0];
          if (cleanSrc.indexOf("images/") === -1) return [];

          var baseSrc = cleanSrc.replace(/\.(jpe?g|png|webp)$/i, "");
          var extMatch = cleanSrc.match(/\.(jpe?g|png|webp)$/i);
          if (!extMatch || baseSrc === cleanSrc) return [];

          var currentExt = extMatch[1].toLowerCase();
          return localImageExts
            .filter(function (ext) {
              return ext !== currentExt;
            })
            .map(function (ext) {
              return baseSrc + "." + ext;
            });
        }

        document.addEventListener(
          "error",
          function (e) {
            var img = e.target;
            if (!img || img.tagName !== "IMG") return;

            var tried = (img.dataset.triedLocalExts || "")
              .split("|")
              .filter(Boolean);
            var candidates = localImageCandidates(img.getAttribute("src"));
            var nextSrc = candidates.find(function (candidate) {
              return tried.indexOf(candidate) === -1;
            });

            if (nextSrc) {
              tried.push(nextSrc);
              img.dataset.triedLocalExts = tried.join("|");
              img.src = nextSrc;
              e.stopImmediatePropagation();
              return;
            }

            if (!img.dataset.errored) {
              img.dataset.errored = "1";
              img.src = imageFallbackSvg;
              e.stopImmediatePropagation();
            }
          },
          true,
        );
      })();
    </script>

    <!-- ░░ D6 SCROLL REVEAL ░░ -->
    <script>
      (function () {
        "use strict";
        var d6Els = document.querySelectorAll(
          ".d6-reveal, .d6-reveal-left, .d6-reveal-right, .d6-reveal-scale",
        );
        if (!("IntersectionObserver" in window) || !d6Els.length) {
          d6Els.forEach(function (el) {
            el.classList.add("visible");
          });
          return;
        }
        var d6Observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                d6Observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.07, rootMargin: "0px 0px -48px 0px" },
        );
        d6Els.forEach(function (el) {
          d6Observer.observe(el);
        });
      })();
    </script>

      const app = getApps().length

      const PRODUCT_IMAGE_MAP = {
        "pearl drop earrings": "images/product-pearl-drop-earrings.jpg",
        "party dangles": "images/product-party-dangles.jpg",
        "gold star studs": "images/product-gold-star-studs.jpg",
        "silver hoops": "images/product-silver-hoops.jpg",
        "purple dangling": "images/product-purple-dangling.jpg",
      };

      const CATEGORY_LABELS = {
        "everyday-elegance": "Everyday Elegance",
        "modern-romance": "Modern Romance",
        "after-dark": "After Dark",
        "heritage-muse": "Heritage Muse",
      };
      const CATEGORY_ORDER = [
        "everyday-elegance",
        "modern-romance",
        "after-dark",
        "heritage-muse",
      ];

      const CATEGORY_ALIASES = {
        all: "",
        jewellery: "",
        jewelry: "",
        collection: "",
        collections: "",
        earring: "everyday-elegance",
        earrings: "everyday-elegance",
        studs: "everyday-elegance",
        stud: "everyday-elegance",
        simple: "everyday-elegance",
        daily: "everyday-elegance",
        everyday: "everyday-elegance",
        "everyday elegance": "everyday-elegance",
        "gold star studs": "everyday-elegance",
        "silver hoops": "everyday-elegance",
        hoops: "modern-romance",
        hoop: "modern-romance",
        pearl: "heritage-muse",
        "pearl drop earrings": "heritage-muse",
        purple: "modern-romance",
        dangling: "modern-romance",
        "purple dangling": "modern-romance",
        romance: "modern-romance",
        romantic: "modern-romance",
        "modern romance": "modern-romance",
        korean: "after-dark",
        "korean style": "after-dark",
        party: "after-dark",
        dangles: "after-dark",
        "party dangles": "after-dark",
        evening: "after-dark",
        glamour: "after-dark",
        glamorous: "after-dark",
        "party wear": "after-dark",
        statement: "after-dark",
        heritage: "heritage-muse",
        "heritage muse": "heritage-muse",
        traditional: "heritage-muse",
        classic: "heritage-muse",
      };

      function normalizeCategory(value) {
        const key = String(value || "")
          .trim()
          .toLowerCase();
        return CATEGORY_LABELS[key] ? key : CATEGORY_ALIASES[key] || "";
      }

      function categoryDisplayLabel(value) {
        const normalized = normalizeCategory(value);
        return (
          CATEGORY_LABELS[normalized] || CATEGORY_LABELS["everyday-elegance"]
        );
      }

      function inferProductCategory(product, docId) {
        const current = normalizeCategory(product?.category);
        if (current) return current;

        const haystack = [
          product?.name,
          product?.tag,
          product?.description,
          product?.category,
          docId,
        ]
          .join(" ")
          .toLowerCase();

        for (const alias of Object.keys(CATEGORY_ALIASES)) {
          if (haystack.includes(alias)) return CATEGORY_ALIASES[alias];
        }

        let hash = 0;
        const seed = String(product?.name || docId || "");
        for (let i = 0; i < seed.length; i += 1) {
          hash = (hash + seed.charCodeAt(i) * (i + 1)) % CATEGORY_ORDER.length;
        }
        return CATEGORY_ORDER[hash];
      }

      function withCategoryArchitecture(product, docId) {
        const categorySlug = inferProductCategory(product, docId);
        return Object.assign({}, product, {
          category: categoryDisplayLabel(categorySlug),
          categorySlug,
        });
      }

      function isUsableImageUrl(value) {
        const img = String(value || "").trim();
        return (
          img &&
          (img.startsWith("http://") ||
            img.startsWith("https://") ||
            img.startsWith("data:image/") ||
            /^(?:\.\/|\/)?images\/.+\.(jpe?g|png|webp)$/i.test(img))
        );
      }

      function productPrimaryImage(product) {
        const images = product?.images || {};
        return (
          product?.productImage ||
          images.productImage ||
          product?.image ||
          product?.imageUrl ||
          product?.imageURL ||
          ""
        );
      }

      function productLocalImage(product) {
        const structured = productPrimaryImage(product);
        if (isUsableImageUrl(structured)) return structured;

        // Priority 1: use product.image / product.imageUrl if it is a real external URL
        // (Firestore / Cloudinary / CDN / any http-s link). Never substitute with local files.
        const img = String(product?.image || product?.imageUrl || "").trim();
        if (isUsableImageUrl(img)) return img;

        // Priority 2: already a local images/ path — pass through unchanged
        if (img && /^(?:\.\/|\/)?images\/.+\.(jpe?g|png|webp)$/i.test(img)) {
          return img;
        }

        // Priority 3: name-keyed local map — only reached when product has NO image URL at all
        const key = String(product?.name || "")
          .trim()
          .toLowerCase();
        return (
          PRODUCT_IMAGE_MAP[key] || "images/product-placeholder-jewelry.jpg"
        );
      }

      /* ── In-memory product store ── */
      let allProducts = []; // [{ data: {…}, id: "docId" }]

      /* ─────────────────────────────────────────────────
         window.updateLocalStock(docId, delta)
         OPTIMISTIC UI UPDATE — called by addToCart() in
         script.js immediately after a cart action, before
         Firebase confirms the write.
         Mutates allProducts in-place then re-renders so the
         card flips to Out of Stock instantly. onSnapshot stays
         the long-term source of truth and will reconcile if
         the write ever fails.
      ───────────────────────────────────────────────── */
      window.updateLocalStock = function (docId, delta) {
        // delta is -1 when adding one item to cart
        const item = allProducts.find(function (p) {
          return p.id === docId;
        });
        if (!item) return; // not in memory yet — onSnapshot will handle it

        // PART 3: mutate the single in-memory object directly (no stale copy)
        item.data.stock = Math.max(0, item.data.stock + delta);

        console.log(
          "[ChicCharms] optimistic stock:",
          docId,
          "| delta:",
          delta,
          "→ stock now:",
          item.data.stock,
        );

        // PART 1 + 4: re-render immediately through the same render pipeline
        filterAndRenderProducts();
      };

      /* ─────────────────────────────────────────────────
         buildProductCard(product, docId) → HTML string
         D3 Luxury Edition
      ───────────────────────────────────────────────── */
      function buildProductCard(product, docId) {
        // P1+P5: Same normalization as the storage loop — resilient to bad Firestore data.
        const _rawStock = product.stock ?? product.Stock ?? null;
        const _parsed = Number(_rawStock ?? 0);
        const stock = isNaN(_parsed) ? 0 : _parsed;
        const inStock = stock > 0;

        console.log(
          "[ChicCharms] buildProductCard:",
          product.name,
          "| raw stock:",
          product.stock,
          "(type:",
          typeof product.stock + ")",
          "→ stock:",
          stock,
          "| inStock:",
          inStock,
        );

        const productUrl = `product.html?id=${docId}&category=${product.categorySlug}`;
        const safeName = product.name.replace(/'/g, "\\'");
        const price = Number(product.price || 0);
        const oldPrice = Number(
          product.oldPrice ||
            product.compareAtPrice ||
            product.mrp ||
            (price ? Math.ceil(price * 1.28) : 0),
        );
        const discount =
          oldPrice > price && price
            ? Math.max(5, Math.round(((oldPrice - price) / oldPrice) * 100))
            : 0;
        const ratingSeed = String(product.name || docId || "").length % 4;
        const rating = product.rating || (4.6 + ratingSeed / 10).toFixed(1);
        const commerceBadge =
          product.tag ||
          (ratingSeed === 0
            ? "Bestseller"
            : ratingSeed === 1
              ? "New"
              : "Viral");

        /* ── Badge system — luxury edition ── */
        let badgesHTML = "";
        if (product.tag) {
          const tagLow = product.tag.toLowerCase();
          let badgeClass = "lux-badge--trending";
          if (tagLow.includes("best") || tagLow.includes("seller"))
            badgeClass = "lux-badge--bestseller";
          else if (tagLow.includes("new")) badgeClass = "lux-badge--new";
          else if (tagLow.includes("low") || tagLow.includes("stock"))
            badgeClass = "lux-badge--lowstock";
          badgesHTML += `<span class="lux-badge ${badgeClass}">${product.tag}</span>`;
        }
        if (!inStock) {
          badgesHTML += `<span class="lux-badge lux-badge--outofstock">Sold Out</span>`;
        }

        /* ── Category label ── */
        const catLabel = product.categorySlug
          ? `<p class="lux-product-category">${categoryDisplayLabel(product.categorySlug)}</p>`
          : "";

        /* ── Description ── */
        const descHTML = product.description
          ? `<p class="lux-product-desc">${product.description}</p>`
          : "";

        /* ── Quick add overlay ── */
        const quickAddBtn = inStock
          ? `<button class="lux-quick-add-btn" onclick="addToCart('${safeName}', ${product.price}, '${docId}', ${stock}); if(typeof updateLocalStock==='function') updateLocalStock('${docId}', -1);">Quick Add</button>`
          : `<button class="lux-quick-add-btn" disabled>Sold Out</button>`;

        /* ── Main cart button ── */
        const cartBtn = inStock
          ? `<button class="lux-cart-btn" onclick="addToCart('${safeName}', ${product.price}, '${docId}', ${stock}); if(typeof updateLocalStock==='function') updateLocalStock('${docId}', -1);">
               <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
               Add to Cart
             </button>`
          : `<button class="lux-cart-btn" disabled>Out of Stock</button>`;

        /* ── Stock indicator ── */
        const stockDot = inStock
          ? `<span class="lux-stock-dot in-stock">In Stock</span>`
          : `<span class="lux-stock-dot out-of-stock">Sold Out</span>`;

        return `
          <article class="product-card-lux" data-category="${product.categorySlug}">
            <div class="lux-img-container">
              <span class="mobile-product-badge">${commerceBadge}</span>
              ${badgesHTML ? `<div class="lux-badges">${badgesHTML}</div>` : ""}
              <a href="${productUrl}" class="lux-img-link" aria-label="View ${product.name}">
                <img
                  src="${productLocalImage(product)}"
                  alt="${product.name}"
                  loading="lazy"
                  onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22260%22%3E%3Crect width=%22200%22 height=%22260%22 fill=%22%23FAF1F4%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2240%22%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E'"
                />
              </a>
              <div class="lux-hover-layer"></div>
              <div class="lux-quick-add">${quickAddBtn}</div>
            </div>
            <div class="lux-product-info">
              ${catLabel}
              <a href="${productUrl}" class="lux-product-name">${product.name}</a>
              <div class="mobile-product-rating" aria-label="${rating} out of 5 rating">
                <span aria-hidden="true">★</span> ${rating}
              </div>
              ${descHTML}
              <div class="lux-product-bottom">
                <div class="lux-price-wrap">
                  <span class="lux-price">₹${product.price}</span>
                  ${
                    oldPrice > price
                      ? `<span class="mobile-old-price">₹${oldPrice}</span><span class="mobile-discount">${discount}% off</span>`
                      : ""
                  }
                </div>
                ${stockDot}
              </div>
              ${cartBtn}
            </div>
          </article>
        `;
      }

      /* ─────────────────────────────────────────────────
         filterAndRenderProducts()
         Reads controls → filters allProducts → renders
      ───────────────────────────────────────────────── */
      function filterAndRenderProducts() {
        const container = document.getElementById("products-container");
        const resultCount = document.getElementById("resultCount");
        const searchText = document
          .getElementById("searchInput")
          .value.trim()
          .toLowerCase();
        const category = document.getElementById("categoryFilter").value;
        const sort = document.getElementById("sortFilter").value;
        const clearBtn = document.getElementById("searchClear");

        // Toggle clear button visibility
        clearBtn.style.display = searchText ? "block" : "none";

        // Mark selects as "active" when a non-default option is chosen
        document
          .getElementById("categoryFilter")
          .classList.toggle("active", category !== "all");
        document
          .getElementById("sortFilter")
          .classList.toggle("active", sort !== "default");

        const normalizedCategory = normalizeCategory(category) || "all";

        // 1. Filter
        let filtered = allProducts.filter(function (item) {
          const p = item.data;
          const searchable = [
            p.name,
            p.tag,
            p.description,
            p.category,
            categoryDisplayLabel(p.categorySlug),
            p.categorySlug,
          ]
            .join(" ")
            .toLowerCase();

          // Search match
          const matchSearch = !searchText || searchable.includes(searchText);

          // Category match
          const matchCat =
            normalizedCategory === "all" || p.categorySlug === normalizedCategory;

          return matchSearch && matchCat;
        });

        let usedFallbackResults = false;
        if (filtered.length === 0 && allProducts.length) {
          usedFallbackResults = true;
          filtered = allProducts.filter(function (item) {
            const p = item.data;
            const searchable = [
              p.name,
              p.tag,
              p.description,
              p.category,
              categoryDisplayLabel(p.categorySlug),
              p.categorySlug,
            ]
              .join(" ")
              .toLowerCase();
            return !searchText || searchable.includes(searchText);
          });
          if (filtered.length === 0) filtered = allProducts.slice();
        }

        // 2. Sort
        if (sort === "low-high") {
          filtered.sort(function (a, b) {
            return Number(a.data.price) - Number(b.data.price);
          });
        } else if (sort === "high-low") {
          filtered.sort(function (a, b) {
            return Number(b.data.price) - Number(a.data.price);
          });
        } else {
          filtered.sort(function (a, b) {
            const aOrder = CATEGORY_ORDER.indexOf(a.data.categorySlug);
            const bOrder = CATEGORY_ORDER.indexOf(b.data.categorySlug);
            if (aOrder !== bOrder) return aOrder - bOrder;
            return String(a.data.name || "").localeCompare(
              String(b.data.name || ""),
            );
          });
        }

        // 3. Render
        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="lux-empty-state">
              <div class="lux-empty-icon">🌸</div>
              <h3 class="lux-empty-title">The edit is refreshing</h3>
              <p class="lux-empty-sub">Our collection is loading. Please hold on for a moment.</p>
              <button class="lux-empty-btn" onclick="resetFilters()">View All Pieces</button>
            </div>`;
          resultCount.style.display = "none";
        } else {
          // Build cards array
          const cards = filtered.map(function (item) {
            return buildProductCard(item.data, item.id);
          });

          // Inject editorial quote after card 3 (unfiltered full view only)
          const isFiltered =
            searchText || category !== "all" || sort !== "default";
          const quoteHTML = `
            <div class="editorial-quote-strip">
              <p class="editorial-quote-text">"Every woman deserves to feel adorned — effortlessly, every single day."</p>
              <span class="editorial-quote-attr">Chic Charms</span>
            </div>`;

          if (!isFiltered && cards.length >= 4) {
            cards.splice(3, 0, quoteHTML);
          }

          container.innerHTML = cards.join("");

          // Show result count only when filters are active
          if (isFiltered || usedFallbackResults) {
            resultCount.innerHTML = usedFallbackResults
              ? `Showing the closest <strong>${filtered.length}</strong> pieces from the full ChicCharms edit`
              : `Showing <strong>${filtered.length}</strong> of <strong>${allProducts.length}</strong> pieces`;
            resultCount.style.display = "block";
          } else {
            resultCount.style.display = "none";
          }

          // Reveal cards with stagger animation
          requestAnimationFrame(function () {
            container
              .querySelectorAll(".product-card-lux")
              .forEach(function (card) {
                requestAnimationFrame(function () {
                  card.classList.add("revealed");
                });
              });
          });
        }
      }

      /* ─────────────────────────────────────────────────
         resetFilters() — exposed globally for the button
      ───────────────────────────────────────────────── */
      window.resetFilters = function () {
        document.getElementById("searchInput").value = "";
        document.getElementById("categoryFilter").value = "all";
        document.getElementById("sortFilter").value = "default";
        history.replaceState(null, "", "index.html#bestsellers");
        filterAndRenderProducts();
      };

      /* ─────────────────────────────────────────────────
         window.activateCollection(slug)
         Public bridge used by editorial CTA buttons.
         Reuses the identical runtime path as .cat-card clicks:
           1. Set categoryFilter value (same dropdown used by Shop by Style)
           2. Push URL state (same as wireCategoryCards)
           3. filterAndRenderProducts() — same render pipeline
           4. scrollToProducts() — same scroll behaviour
      ───────────────────────────────────────────────── */
      window.activateCollection = function (slug) {
        const filter = document.getElementById("categoryFilter");
        if (!filter) return;
        filter.value = slug;
        history.pushState(
          null,
          "",
          "index.html?category=" + encodeURIComponent(slug) + "#bestsellers",
        );
        filterAndRenderProducts();
        scrollToProducts();
      };

      function applyCategoryFromUrl() {
        if (window._chicCharmsUrlCategoryApplied) return;
        const params = new URLSearchParams(window.location.search);
        const requested = normalizeCategory(
          params.get("category") || params.get("style"),
        );
        if (!requested) return;
        const filter = document.getElementById("categoryFilter");
        if (filter) filter.value = requested;
        window._chicCharmsUrlCategoryApplied = true;
        /* Scroll to grid after the first render cycle settles */
        requestAnimationFrame(function () {
          requestAnimationFrame(scrollToProducts);
        });
      }

      /* ─────────────────────────────────────────────────
         scrollToProducts()
         Smoothly lands the viewport at the product grid,
         accounting for the sticky navbar height so the
         first product card is immediately visible.
         Waits one rAF so the DOM settles after filtering.
      ───────────────────────────────────────────────── */
      function scrollToProducts() {
        requestAnimationFrame(function () {
          const target = document.getElementById("shopControls");
          if (!target) return;
          const navbar = document.getElementById("navbar");
          const navbarH = navbar ? navbar.offsetHeight : 64;
          const offset = 16; // breathing room above the filter bar
          const top =
            target.getBoundingClientRect().top +
            window.pageYOffset -
            navbarH -
            offset;
          window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
        });
      }

      function wireCategoryCards() {
        document
          .querySelectorAll(".cat-card[data-category]")
          .forEach(function (card) {
            card.addEventListener("click", function (e) {
              const slug = normalizeCategory(card.dataset.category);
              const filter = document.getElementById("categoryFilter");
              if (!slug || !filter) return;
              e.preventDefault();
              filter.value = slug;
              history.pushState(
                null,
                "",
                "index.html?category=" +
                  encodeURIComponent(slug) +
                  "#bestsellers",
              );
              filterAndRenderProducts();
              scrollToProducts();
            });
          });
      }

      function persistCategoryToUrl() {
        const slug = document.getElementById("categoryFilter").value;
        if (!slug || slug === "all") {
          history.replaceState(null, "", "index.html#bestsellers");
          return;
        }
        history.replaceState(
          null,
          "",
          "index.html?category=" + encodeURIComponent(slug) + "#bestsellers",
        );
      }

      /* ─────────────────────────────────────────────────
         loadProducts() — fetches from Firestore
      ───────────────────────────────────────────────── */
      function loadProducts() {
        const container = document.getElementById("products-container");
        const controls = document.getElementById("shopControls");

        // Show skeleton while waiting for first snapshot
        container.innerHTML = `
            ${[1, 2, 3, 4, 5, 6]
              .map(
                () => `
              <div class="lux-skeleton-card">
                <div class="lux-skeleton-img"></div>
                <div class="lux-skeleton-body">
                  <div class="lux-skeleton-line title"></div>
                  <div class="lux-skeleton-line desc"></div>
                  <div class="lux-skeleton-line desc2"></div>
                  <div class="lux-skeleton-line price"></div>
                </div>
              </div>`,
              )
              .join("")}
          `;

        // ── PART 1: onSnapshot — fires immediately and on every Firestore change ──
        onSnapshot(
          collection(db, "products"),
          function (snapshot) {
            // ── PART 2: Clear entire UI before every re-render ──
            container.innerHTML = "";

            if (snapshot.empty) {
              container.innerHTML = `<p class="empty">No products available right now 😢</p>`;
              return;
            }

            // ── PART 3: Rebuild allProducts fresh from snapshot ──
            allProducts = [];
            snapshot.forEach(function (doc) {
              const raw = doc.data();
              const data = Object.assign({}, raw);
              const rawStock = raw.stock ?? raw.Stock ?? null;
              const parsed = Number(rawStock ?? 0);
              data.stock = isNaN(parsed) ? 0 : parsed; // NaN failsafe
              const migratedData = withCategoryArchitecture(data, doc.id);

              console.log(
                "[ChicCharms] onSnapshot doc:",
                doc.id,
                "| name:",
                raw.name,
                "| raw.stock:",
                raw.stock,
                "(type:",
                typeof raw.stock + ")",
                "→ normalised:",
                data.stock,
              );
              allProducts.push({ data: migratedData, id: doc.id });
            });

            // Show controls now that we have data
            controls.style.display = "flex";
            applyCategoryFromUrl();

            // ── PART 4: Re-render the whole list with current filter state ──
            filterAndRenderProducts();

            // Attach filter listeners exactly once
            if (!window._chicCharmsListenersAttached) {
              window._chicCharmsListenersAttached = true;
              wireCategoryCards();
              document
                .getElementById("searchInput")
                .addEventListener("input", filterAndRenderProducts);
              document
                .getElementById("categoryFilter")
                .addEventListener("change", function () {
                  persistCategoryToUrl();
                  filterAndRenderProducts();
                  scrollToProducts();
                });
              document
                .getElementById("sortFilter")
                .addEventListener("change", filterAndRenderProducts);
              document
                .getElementById("searchClear")
                .addEventListener("click", function () {
                  document.getElementById("searchInput").value = "";
                  filterAndRenderProducts();
                  document.getElementById("searchInput").focus();
                });
              console.log("[ChicCharms] Filter listeners attached (once)");
            }
          },
          function (error) {
            container.innerHTML = `
            <div class="lux-empty-state">
              <div class="lux-empty-icon">✦</div>
              <h3 class="lux-empty-title">Something went wrong</h3>
              <p class="lux-empty-sub">We're having trouble loading the collection right now. Please try again in a moment.</p>
            </div>`;
            console.error("Firebase onSnapshot error:", error);
          },
        );
      }

      loadProducts();

      /* ═══════════════════════════════════════════════════
         GLOBAL NAVBAR SEARCH
         — shares the same allProducts[] array
         — runs entirely client-side after first Firebase fetch
      ═══════════════════════════════════════════════════ */

      const globalSearchEl = document.getElementById("globalSearch");
      const dropdownEl = document.getElementById("searchDropdown");
      const clearBtnEl = document.getElementById("globalSearchClear");

      /* ── Highlight matched text ── */
      function highlight(text, query) {
        if (!query) return escapeStr(text);
        const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        return escapeStr(text).replace(
          new RegExp("(" + escaped + ")", "gi"),
          "<mark>$1</mark>",
        );
      }

      function escapeStr(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      /* ── Show / hide dropdown ── */
      function openDropdown() {
        dropdownEl.classList.add("open");
        globalSearchEl.setAttribute("aria-expanded", "true");
      }
      function closeDropdown() {
        dropdownEl.classList.remove("open");
        globalSearchEl.setAttribute("aria-expanded", "false");
      }

      /* ── Render results ── */
      function renderSearchResults(query) {
        const text = query.trim().toLowerCase();

        // Hide if empty
        if (!text) {
          closeDropdown();
          clearBtnEl.style.display = "none";
          return;
        }

        clearBtnEl.style.display = "flex";

        // If products haven't loaded yet — show skeleton
        if (allProducts.length === 0) {
          dropdownEl.innerHTML = `
            <div style="padding:14px 14px;display:flex;flex-direction:column;gap:10px;">
              ${[1, 2, 3]
                .map(
                  () =>
                    `<div style="height:44px;background:linear-gradient(90deg,#fdf8f5 25%,#f0ebe6 50%,#fdf8f5 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px;"></div>`,
                )
                .join("")}
            </div>`;
          openDropdown();
          return;
        }

        // Filter — top 5 matches
        const matches = allProducts
          .filter(function (item) {
            return item.data.name.toLowerCase().includes(text);
          })
          .slice(0, 5);

        if (matches.length === 0) {
          dropdownEl.innerHTML = `
            <div class="search-no-results">
              <span>🔍</span>
              No products found for "<strong>${escapeStr(query.trim())}</strong>"
            </div>`;
        } else {
          dropdownEl.innerHTML = matches
            .map(function (item) {
              const p = item.data;
              const url = "product.html?id=" + item.id;
              return `
              <a class="search-result-item" href="${url}" tabindex="0">
                <img class="search-result-img" src="${escapeStr(productLocalImage(p))}" alt="${escapeStr(p.name)}" loading="lazy" />
                <div class="search-result-info">
                  <div class="search-result-name">${highlight(p.name, query.trim())}</div>
                  <div class="search-result-price">₹${Number(p.price).toLocaleString("en-IN")}</div>
                </div>
              </a>`;
            })
            .join("");
        }

        openDropdown();
      }

      /* ── Input handler ── */
      if (globalSearchEl && dropdownEl && clearBtnEl) {
        globalSearchEl.addEventListener("input", function () {
          renderSearchResults(globalSearchEl.value);
        });

      /* ── Clear button ── */
        clearBtnEl.addEventListener("click", function () {
          globalSearchEl.value = "";
          closeDropdown();
          clearBtnEl.style.display = "none";
          globalSearchEl.focus();
        });
      }

      /* ── Keyboard: Escape closes, Enter navigates to first result ── */
      if (globalSearchEl && dropdownEl && clearBtnEl) {
      globalSearchEl.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          closeDropdown();
          globalSearchEl.blur();
        }
        if (e.key === "Enter") {
          const first = dropdownEl.querySelector(".search-result-item");
          if (first) window.location.href = first.getAttribute("href");
        }
      });

      /* ── Click outside to close ── */
      document.addEventListener("click", function (e) {
        const navSearch = document.getElementById("navSearch");
        if (navSearch && !navSearch.contains(e.target)) {
          closeDropdown();
        }
      });

      /* ── Re-open on focus if there's already text ── */
      globalSearchEl.addEventListener("focus", function () {
        if (globalSearchEl.value.trim())
          renderSearchResults(globalSearchEl.value);
      });
      }
    </script>

    <!-- ░░ ADMIN RETURN BANNER SCRIPT ░░
         Checks Firebase Auth + the same sessionStorage cache used by
         admin-guard.js to detect a live admin session. Zero Firestore
         reads — purely client-side. If the cache key exists for the
         signed-in UID, the banner is shown instantly. ── -->
    <script type="module">
      import {
        initializeApp,
        getApps,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyA5Bh77_4HE3yQF0hi5ddvbFLZC7rEerxg",
        authDomain: "chic-charms-store.firebaseapp.com",
        projectId: "chic-charms-store",
        storageBucket: "chic-charms-store.firebasestorage.app",
        messagingSenderId: "342514318589",
        appId: "1:342514318589:web:31c3490c10731e46d75294",
      };

      const app = getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);
      const auth = getAuth(app);

      /* Same cache-key formula as admin-guard.js */
      const adminCacheKey = (uid) => `cc_admin_verified_${uid}`;

      const banner = document.getElementById("adminReturnBanner");
      const emailSpan = document.getElementById("adminReturnEmail");

      function setAdminBannerHeight() {
        const height =
          document.body.classList.contains("admin-return-active") && banner
            ? banner.offsetHeight
            : 0;
        document.documentElement.style.setProperty(
          "--admin-return-banner-height",
          `${height}px`,
        );
      }

      function hideAdminBanner() {
        document.body.classList.remove("admin-return-active");
        if (banner) {
          banner.style.display = "none";
          banner.setAttribute("aria-hidden", "true");
        }
        setAdminBannerHeight();
      }

      function showAdminBanner(user) {
        if (!banner) return;
        if (emailSpan) emailSpan.textContent = user.email || "admin";
        banner.style.display = "flex";
        banner.setAttribute("aria-hidden", "false");
        document.body.classList.add("admin-return-active");
        setAdminBannerHeight();
      }

      window.addEventListener("resize", setAdminBannerHeight);

      onAuthStateChanged(auth, (user) => {
        if (!user) {
          hideAdminBanner();
          return;
        }

        /* Only show if this UID was verified as admin in this session */
        let isVerifiedAdmin = false;
        try {
          isVerifiedAdmin =
            sessionStorage.getItem(adminCacheKey(user.uid)) === "1";
        } catch (_) {}

        if (!isVerifiedAdmin) {
          hideAdminBanner();
          return;
        }

        showAdminBanner(user);
      });
    </script>
    <!-- ░░ ABOUT NAV — Brand Story Reveal Handler ░░
         Intercepts the ABOUT nav click, reveals the hidden
         brand story section + its marquee, then smooth-scrolls
         to the section. On subsequent clicks it just scrolls.
    ══════════════════════════════════════════════════ -->
    <script>
      (function () {
        var aboutLink = document.getElementById("navAboutLink");
        var storySection = document.getElementById("why-us");
        var storyMarquee = storySection
          ? storySection.nextElementSibling
          : null;

        if (!aboutLink || !storySection) return;

        aboutLink.addEventListener("click", function (e) {
          e.preventDefault();

          /* Reveal section if not already shown */
          if (!storySection.classList.contains("about-revealed")) {
            storySection.classList.add("about-revealed");
            if (storyMarquee && storyMarquee.classList.contains("d6-marquee")) {
              storyMarquee.classList.add("about-revealed");
            }
          }

          /* Smooth scroll after a brief paint tick so display:block registers */
          requestAnimationFrame(function () {
            storySection.scrollIntoView({ behavior: "smooth", block: "start" });
          });

          /* Close mobile menu if open */
          var navLinks = document.getElementById("navLinks");
          var hamburger = document.getElementById("hamburger");
          if (navLinks) navLinks.classList.remove("open");
          if (hamburger) hamburger.setAttribute("aria-expanded", "false");
          document.body.classList.remove("d7-menu-open");
        });
      })();
    </script>
    <script src="final-mobile-stabilization.js" defer></script>
