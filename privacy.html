<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy - ChicCharms</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="final-mobile-stabilization.css" media="(max-width: 768px)" />
  <style>
    body { background:#fffaf7; color:#221917; font-family:Jost, system-ui, sans-serif; margin:0; }
    .policy-page { max-width:760px; margin:0 auto; padding:calc(76px + 24px) 20px 48px; }
    .policy-page h1 { font-family:"Playfair Display", serif; font-size:2rem; margin:0 0 12px; }
    .policy-card { background:#fff; border:1px solid rgba(181,101,122,.14); border-radius:22px; padding:18px; box-shadow:0 14px 34px rgba(78,45,38,.08); }
    .policy-card p { color:rgba(34,25,23,.66); line-height:1.6; }
  </style>
  <link rel="stylesheet" href="mobile-comprehensive.css" media="(max-width: 1024px)" />
  <link rel="stylesheet" href="cc-bottom-nav.css" />
  <link rel="stylesheet" href="cc-material-icons.css" />
    <link rel="stylesheet" href="cc-global-header.css" />
  <link rel="icon" type="image/png" href="favicon.png"/>
</head>
<body>
  <main class="policy-page">
    <h1>Privacy Policy</h1>
    <section class="policy-card">
      <p>We use customer information to process orders, provide support, improve the store experience, and communicate important updates.</p>
      <p>Payment information is handled through secure payment partners and is not stored directly by ChicCharms.</p>
    </section>
  </main>
  <script src="final-mobile-stabilization.js" defer></script>
  <script src="cc-bottom-nav.js" defer></script>
  <script src="cc-material-icons.js" defer></script>
    <script src="cc-global-header.js" defer></script>
</body>
</html>
