<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Your Wishlist • Chic Charms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="wishlist.css" />
  <link rel="stylesheet" href="cc-bottom-nav.css" />
  <style>
    body { background: #fff8f7; }
    .mobile-shell { max-width: 440px; margin: 0 auto; min-height: 100dvh; background: #fff8f7; }
    header { 
      position: sticky; top: 0; z-index: 40; 
      background: rgba(255,248,247,.93); backdrop-filter: blur(10px); 
      border-bottom: 1px solid #d7c1c5; 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 0 20px; height: 68px;
    }
    header h1 { font-family: "Playfair Display", serif; font-size: 20px; color: #8e4559; margin: 0; }
    .back-btn { color: #1f1a1b; display: flex; align-items: center; }
    .cart-btn { color: #1f1a1b; position: relative; display: flex; align-items: center; }
    .cart-count { 
      position: absolute; -top: 5px; -right: 8px; 
      background: #8e4559; color: white; 
      font-size: 9px; min-width: 14px; height: 14px; 
      border-radius: 50%; display: flex; align-items: center; justify-content: center; 
    }
  </style>
</head>
<body>
  <div class="mobile-shell">
    <header>
      <a href="javascript:history.back()" class="back-btn" aria-label="Go back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <h1>Wishlist <span id="wishlist-header-count" class="count"></span></h1>
      <a href="cart.html" class="cart-btn" aria-label="View bag">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-count wishlist-count" style="display:none">0</span>
      </a>
    </header>

    <main class="wishlist-page">
      <!-- Empty State -->
      <div id="wishlist-empty-state" class="wishlist-empty" style="display:none">
        <div class="wishlist-empty-icon">❤️</div>
        <h2>Your Wishlist is Empty</h2>
        <p>Save your favourite jewellery to purchase later. They will appear here so you can find them easily.</p>
        <a href="index.html" class="wishlist-continue-btn">Continue Shopping</a>
      </div>

      <!-- Wishlist Grid -->
      <div id="wishlist-grid" class="wishlist-grid">
        <!-- Wishlist items will be injected here -->
      </div>
    </main>
  </div>

  <div id="cartToast" class="cart-toast"></div>

  <script src="script.js"></script>
  <script src="wishlist-system.js"></script>
  <script src="cc-bottom-nav.js" defer></script>
  
  <script>
    // Wishlist Page Logic
    (function() {
      function renderWishlist() {
        const items = window.CCWishlist.get();
        const grid = document.getElementById('wishlist-grid');
        
        if (!items || items.length === 0) {
          window.CCWishlist.syncUI();
          return;
        }

        grid.innerHTML = items.map((item, index) => `
          <div class="wishlist-card card-appear" style="animation-delay: ${index * 0.1}s">
            <button class="wishlist-remove-btn" 
                    data-wishlist-action="remove" 
                    data-wishlist-id="${item.id}" 
                    aria-label="Remove from wishlist">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <a href="product.html?id=${item.id}" class="wishlist-img-link">
              <img src="${item.image || 'images/editorial-light-meets-gold.png'}" alt="${item.name}">
            </a>
            <div class="wishlist-content">
              <span class="wishlist-category">${item.category || 'Jewellery'}</span>
              <a href="product.html?id=${item.id}" class="wishlist-name">${item.name}</a>
              <div class="wishlist-price-row">
                <span class="wishlist-price">₹${Number(item.price).toLocaleString('en-IN')}</span>
              </div>
              <button class="wishlist-move-btn" 
                      data-wishlist-action="move-to-cart" 
                      data-wishlist-id="${item.id}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                Move to Bag
              </button>
            </div>
          </div>
        `).join('');
        
        window.CCWishlist.syncUI();
      }

      // Initial render
      document.addEventListener('DOMContentLoaded', renderWishlist);
      
      // Re-render when wishlist is updated
      window.addEventListener('wishlistUpdated', renderWishlist);
    })();
  </script>
</body>
</html>
