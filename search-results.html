  /* Collection card */

  .collection-card:hover img { transform:scale(1.04); }

    position:absolute; inset:0; background:linear-gradient(90deg, rgba(255,248,247,.94) 38%, rgba(255,248,247,.18) 100%);

  /* Product result row */

  /* View all button */

  /* Bottom nav */
  .bottom-nav {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
    width: 100%; max-width: 440px; z-index: 60;
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: rgba(255,248,247,0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(215,193,197,0.5);
  }
  .bottom-nav a {
    display:flex; flex-direction:column; align-items:center; gap:2px;

  }
  .bottom-nav a.active { color:#8e4559; background: rgba(171,93,113,0.10); }
  .bottom-nav .material-symbols-outlined { font-size:24px; }

  .fade-in { animation: fadeUp .38s cubic-bezier(.16,1,.3,1) both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation:none; } }

  .skeleton { background: linear-gradient(90deg,#f6eceb 25%, #fcf1f1 50%, #f6eceb 75%); background-size:200% 100%; animation: sh 1.1s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
</style>

<script>
/* Chic Charms – Search Results (mobile) */
(function(){
'use strict';

const FIREBASE = {
  apiKey: "AIzaSyA5Bh77_4HE3yQF0hi5ddvbFLZC7rEerxg",
  projectId: "chic-charms-store"
};

const CATEGORIES = [
  { key: "everyday-elegance", label: "Stud Earrings", aliases: ["stud","everyday","minimal","daily","earring"], img: "images/editorial-minimal-soul-closeup.png" },
  { key: "everyday-elegance", label: "Hoop Earrings", aliases: ["hoop","gold hoops","circle"], img: "images/editorial-everyday-hoops.png", distinct:"hoops" },
  { key: "modern-romance", label: "Drop Earrings", aliases: ["drop","dangle","romance","korean"], img: "images/story-soft-pearl-drop.png" },
  { key: "after-dark", label: "Statement Earrings", aliases: ["statement","party","evening","bold","after dark"], img: "images/style-after-dark.png" },
  { key: "heritage-muse", label: "Pearl Collection", aliases: ["pearl","pearls","muse","heritage","bridal"], img: "images/story-soft-pearl-drop.png" }
];

const COLLECTIONS = [
  { key: "pearl", title: "The Pearl Edit", subtitle: "Featured Edit", match: ["pearl"], img: "images/story-soft-pearl-drop.png", category: "heritage-muse" },
  { key: "korean", title: "Korean Morning Edit", subtitle: "K-Beauty Inspired", match: ["korean","minimal","daily"], img: "images/editorial-korean-morning-coffee.png", category: "modern-romance" },
  { key: "gold", title: "Everyday Gold", subtitle: "Daily Luxury", match: ["gold","hoop"], img: "images/editorial-everyday-hoops.png", category: "everyday-elegance" },
  { key: "evening", title: "After Dark", subtitle: "Soft Date Night", match: ["evening","party","statement","dark"], img: "images/editorial-soft-date-night.png", category: "after-dark" }
];

const qInput = document.getElementById('qInput');
const clearBtn = document.getElementById('clearBtn');
const debounceHint = document.getElementById('debounceHint');
const resultsWrap = document.getElementById('resultsWrap');
const loadingState = document.getElementById('loadingState');

function getQuery(){ return new URLSearchParams(location.search).get('q') || ''; }

let allProducts = [];
let productsLoaded = false;

function parseProduct(doc){
  const f = doc.fields || {};
  const gv = k => f[k]?.stringValue ?? f[k]?.integerValue ?? f[k]?.doubleValue ?? null;
  return {
    id: (doc.name||'').split('/').pop(),
    name: gv('name') || 'Chic Charms Piece',
    price: Number(gv('price')||0),
    image: gv('image') || gv('imageUrl') || '',
    category: (gv('category')||'').toLowerCase(),
    description: gv('description') || ''
  };
}
function productImg(p){
  if(p.image && /^https?:\/\//.test(p.image)) return p.image;
  if(p.image && p.image.startsWith('images/')) return p.image;
  const fallbacks = [
    "images/editorial-light-meets-gold.png",
    "images/editorial-everyday-hoops.png",
    "images/story-soft-pearl-drop.png",
    "images/editorial-minimal-soul-closeup.png"
  ];
  let h=0; for(let i=0;i<p.name.length;i++) h=(h*31+p.name.charCodeAt(i))>>>0;
  return fallbacks[h % fallbacks.length];
}
function inr(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }

async function loadProducts(){
  const url = `https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents/products?pageSize=80&key=${FIREBASE.apiKey}`;
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    allProducts = (j.documents||[]).map(parseProduct).filter(p=>p.price>0);
  }catch(e){
    // offline fallback
    allProducts = [
      {id:'fb1', name:'Baroque Pearl Studs', price:1299, image:'images/editorial-minimal-soul-closeup.png', category:'heritage-muse', description:'pearl stud'},
      {id:'fb2', name:'Classic Akoya Strand', price:2450, image:'images/story-soft-pearl-drop.png', category:'heritage-muse', description:'pearl necklace'},
      {id:'fb3', name:'Luminous Pearl Ring', price:950, image:'images/editorial-light-meets-gold.png', category:'heritage-muse', description:'pearl ring'},
      {id:'fb4', name:'Tear Drop Diamond & Pearl', price:2100, image:'images/editorial-soft-date-night.png', category:'modern-romance', description:'pearl drop earrings'},
      {id:'fb5', name:'Midnight Hoops', price:1899, image:'images/editorial-everyday-hoops.png', category:'everyday-elegance', description:'gold hoops'},
      {id:'fb6', name:'Aurora Star Studs', price:899, image:'images/editorial-minimal-soul-closeup.png', category:'everyday-elegance', description:'minimal stud'}
    ];
  }
  productsLoaded = true;
  render();
}

function matches(text, q){
  if(!q) return true;
  text = (text||'').toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(tok => text.includes(tok));
}

function render(){
  const q = qInput.value.trim().toLowerCase();
  loadingState.style.display = 'none';
  resultsWrap.style.display = '';

  // --- Categories ---
  const catCounts = {};
  allProducts.forEach(p=>{
    const key = p.category || 'everyday-elegance';
    catCounts[key] = (catCounts[key]||0)+1;
  });
  // deduplicate CATEGORIES by label
  const seen = new Set();
  const matchedCats = CATEGORIES.filter(c=>{
    if(seen.has(c.label)) return false;
    seen.add(c.label);
    if(!q) return true;
    const hay = (c.label + ' ' + c.aliases.join(' ')).toLowerCase();
    return matches(hay, q);
  }).map(c=>{
    const count = catCounts[c.key] || 0;
    return {...c, count};
  });

  const catList = document.getElementById('catList');
  const catEmpty = document.getElementById('catEmpty');
  if(matchedCats.length){
    catEmpty.style.display='none';
    catList.innerHTML = matchedCats.map(c => `
      <a class="cat-row" href="shop.html?category=${encodeURIComponent(c.key)}">
        <div><h4>${esc(c.label)}</h4><p>${c.count} products</p></div>
        <span class="material-symbols-outlined text-outline">chevron_right</span>
      </a>
    `).join('');
  } else {
    catList.innerHTML = '';
    catEmpty.style.display = '';
  }
  document.getElementById('catSection').style.display = matchedCats.length || q ? '' : 'none';

  // --- Collections ---
  const coll = COLLECTIONS.find(col => !q || col.match.some(m => q.includes(m)));
  const collSection = document.getElementById('collectionSection');
  if(coll){
    collSection.style.display = '';
    document.getElementById('collectionCard').innerHTML = `
      <div class="collection-card" data-cat="${escAttr(coll.category)}" role="link" tabindex="0">
        <img src="${escAttr(coll.img)}" alt="${escAttr(coll.title)}" loading="lazy">
        <div class="cc-overlay">
          <div>
            <span style="font-family:Jost,sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#8e4559;font-weight:600">${esc(coll.subtitle)}</span>
            <h3 style="font-family:'Playfair Display',Georgia,serif;font-size:22px;color:#1f1a1b;margin:4px 0 8px">${esc(coll.title)}</h3>
            <span style="font-family:Jost,sans-serif;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;text-decoration:underline;text-underline-offset:3px;color:#1f1a1b">Explore</span>
          </div>
        </div>
      </div>`;
    const ccEl = document.getElementById('collectionCard').querySelector('.collection-card');
    const goColl = ()=> location.href = 'shop.html?category=' + encodeURIComponent(coll.category);
    ccEl.addEventListener('click', goColl);
    ccEl.addEventListener('keydown', e=>{ if(e.key==='Enter') goColl(); });
  } else {
    collSection.style.display = 'none';
  }

  // --- Products ---
  const prods = q
    ? allProducts.filter(p => matches((p.name+' '+p.category+' '+p.description).toLowerCase(), q))
    : allProducts.slice(0,8);

  const prodList = document.getElementById('prodList');
  const prodEmpty = document.getElementById('prodEmpty');
  const viewAllWrap = document.getElementById('viewAllWrap');
  const viewAllCount = document.getElementById('viewAllCount');

  if(prods.length){
    prodEmpty.style.display='none';
    prodList.innerHTML = prods.map(p => `
      <a class="prod-row" href="product.html?id=${encodeURIComponent(p.id)}">
        <div class="prod-thumb"><img src="${escAttr(productImg(p))}" alt="${escAttr(p.name)}" loading="lazy"></div>
        <div class="prod-meta">
          <span class="kicker">Collection: ${esc((p.category||'Chic Charms').replace(/-/g,' ').replace(/\b\w/g,m=>m.toUpperCase()))}</span>
          <h4>${esc(p.name)}</h4>
          <p>Earrings • ${inr(p.price)}</p>
        </div>
      </a>
    `).join('');
    viewAllCount.textContent = prods.length;
    viewAllWrap.style.display = '';
  } else {
    prodList.innerHTML = '';
    prodEmpty.style.display='';
    prodEmpty.textContent = q ? `No results for “${qInput.value.trim()}”. Try pearl, hoops, korean.` : 'Start typing to search.';
    viewAllWrap.style.display='none';
  }

  document.getElementById('viewAllBtn').onclick = ()=>{
    const qq = qInput.value.trim();
    location.href = 'shop.html' + (qq ? '?q=' + encodeURIComponent(qq) : '');
  };
}

// Input wiring
function setQueryInUrl(q){
  const url = new URL(location.href);
  if(q) url.searchParams.set('q', q); else url.searchParams.delete('q');
  history.replaceState(null, '', url);
}

let debounceT;
qInput.addEventListener('input', ()=>{
  clearBtn.style.display = qInput.value ? '' : 'none';
  debounceHint.style.opacity = '1';
  clearTimeout(debounceT);
  debounceT = setTimeout(()=>{
    debounceHint.style.opacity = '0';
    setQueryInUrl(qInput.value.trim());
    if(productsLoaded) render();
  }, 320);
});
qInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); clearTimeout(debounceT); debounceHint.style.opacity='0'; setQueryInUrl(qInput.value.trim()); render(); }
});
clearBtn.addEventListener('click', ()=>{ qInput.value=''; clearBtn.style.display='none'; qInput.focus(); setQueryInUrl(''); render(); });

document.getElementById('menuBtn').addEventListener('click', ()=>{ location.href='index.html'; });

// init
const initialQ = getQuery();
qInput.value = initialQ;
clearBtn.style.display = initialQ ? '' : 'none';
resultsWrap.style.display = 'none';
loadingState.style.display = '';
loadProducts();

function esc(s){ return String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
function escAttr(s){ return esc(s); }

})();
</script>
</body>
</html>
