  <style>
    /* Material Symbols sizing — do not override visibility */
    .material-symbols-outlined { font-size: 20px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Accordion */
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .accordion-open .accordion-content { max-height: 500px; }

    /* SCROLL FIX */
    html {
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      font-size: 16px;
    }
    body {
      overflow-x: hidden;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }

    /* Gallery */
    #galleryContainer {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
    }

    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, #f6eceb 25%, #fcf1f1 50%, #f6eceb 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f1a1b;
      color: white;
      padding: 12px 24px;
      border-radius: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Gallery dots */
    .gallery-dots {
      position: absolute;
      bottom: 16px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 10;
    }
    .gallery-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transition: all 0.3s ease;
      border: none; padding: 0; cursor: pointer;
    }
    .gallery-dot.active {
      background: white;
      width: 20px;
      border-radius: 3px;
    }

    /* Description clamp */
    .desc-clamped { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .desc-expanded { display: block; }

    /* FAB */
    .fab-circle {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.80);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      color: #8e4559;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: none; cursor: pointer;
      transition: transform 0.15s ease;
    }
    .fab-circle:active { transform: scale(0.95); }
    .fab-circle.wishlisted svg path {
      fill: #B5657A;
      stroke: #B5657A;
    }

    /* Variant buttons */
    .variant-btn {
      padding: 8px 16px;
      border: 1px solid #857276;
      font-size: 13px;
      font-family: 'Jost', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      background: transparent;
      color: #1f1a1b;
      transition: all 0.2s ease;
    }
    .variant-btn:hover { border-color: #8e4559; }
    .variant-btn.active {
      background: #8e4559;
      color: white;
      border-color: #8e4559;
    }

    /* Stock badge */
    .stock-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-family: 'Jost', sans-serif;
    }
    .stock-badge .dot { width: 6px; height: 6px; border-radius: 50%; }

    /* Editorial overlay */
    .editorial-overlay {
      background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 50%);
    }

    /* Promise icon — now SVG-based, not font-based */
    .promise-icon-wrap {
      color: #8e4559;
      width: 28px;
      height: 28px;
      display: block;
      margin: 0 auto 8px;
    }
    .promise-icon-wrap svg {
      width: 28px;
      height: 28px;
    }

    /* Trust bar icon — inline SVG */
    .trust-icon-wrap {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #8e4559;
      flex-shrink: 0;
    }
    .trust-icon-wrap svg {
      width: 16px;
      height: 16px;
    }

    /* Sticky Product CTA geometry lives in product-sticky-cta.css. */

    /* Detail row */
    .detail-row { display: flex; flex-direction: column; }
    .detail-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: #534346; margin-bottom: 4px;
    }
    .detail-value { font-size: 14px; color: #1f1a1b; line-height: 1.5; }

    /* Hide sections until data loads */
    .data-section { display: none; }
    .data-section.has-data { display: block; }

  </style>

// ── Product-only Sticky CTA state ──
function setProductCtaReady(isReady) {
  const bar = document.getElementById('stickyBar');
  const ready = Boolean(isReady);
  if (!bar) return;

  bar.classList.toggle('is-ready', ready);
  bar.setAttribute('aria-hidden', ready ? 'false' : 'true');
  document.body.classList.toggle('cc-product-cta-ready', ready);
}

// ── Helpers ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function formatPrice(price) {
  const n = Number(price) || 0;
  return SITE_CONFIG.currency + n.toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function isUsableUrl(url) {
  if (!url || typeof url !== 'string') return false;
  const t = url.trim();
  return t.length > 0 && (t.startsWith('http://') || t.startsWith('https://') || t.startsWith('/') || t.startsWith('images/'));
}

function getCart() {
  try { return JSON.parse(localStorage.getItem('cc_cart') || '[]'); } catch(e) { return []; }
}

function saveCart(cart) {
  localStorage.setItem('cc_cart', JSON.stringify(cart));
  updateCartBadges();
}

function updateCartBadges() {
  const cart = getCart();
  const count = cart.reduce((s, i) => s + (Number(i.quantity) || 1), 0);
  ['cartBadge', 'navCartBadge'].forEach(id => {
    const b = document.getElementById(id);
    if (b) { b.textContent = count > 9 ? '9+' : String(count); b.classList.toggle('hidden', count === 0); }
  });
  // Also update the global header's mobile cart count
  const mobileCount = document.querySelector('.mobile-cart-count');
  if (mobileCount) {
    mobileCount.textContent = count > 9 ? '9+' : String(count);
    mobileCount.style.display = count > 0 ? '' : 'none';
  }
}

function getWishlist() {
  try { return JSON.parse(localStorage.getItem('cc_wishlist') || '[]'); } catch(e) { return []; }
}

function saveWishlist(w) { localStorage.setItem('cc_wishlist', JSON.stringify(w)); }

// ── Image extraction: support ANY image schema ──
function extractAllImages(product, variant) {
  const images = [];
  const seen = new Set();

  function add(src, label) {
    if (!isUsableUrl(src) || seen.has(src)) return;
    seen.add(src);
    images.push({ src, label });
  }

  if (variant) {
    if (variant.images) {
      add(variant.images.productImage, 'Product');
      add(variant.images.modelImage, 'On Model');
      add(variant.images.lifestyle, 'Lifestyle');
      add(variant.images.detail, 'Detail');
      add(variant.images.flat, 'Flat Lay');
      if (Array.isArray(variant.images.all)) variant.images.all.forEach((s, i) => add(s, `View ${i+1}`));
      if (Array.isArray(variant.images.gallery)) variant.images.gallery.forEach((s, i) => add(s, `View ${i+1}`));
    }
    add(variant.productImage, 'Product');
    add(variant.modelImage, 'On Model');
    add(variant.image, 'Product');
    add(variant.imageUrl, 'Product');
  }

  if (product.images) {
    add(product.images.productImage, 'Product');
    add(product.images.modelImage, 'On Model');
    add(product.images.lifestyle, 'Lifestyle');
    add(product.images.detail, 'Detail');
    add(product.images.flat, 'Flat Lay');
    if (Array.isArray(product.images.all)) product.images.all.forEach((s, i) => add(s, `View ${i+1}`));
    if (Array.isArray(product.images.gallery)) product.images.gallery.forEach((s, i) => add(s, `View ${i+1}`));
  }

  add(product.productImage, 'Product');
  add(product.image, 'Product');
  add(product.imageUrl, 'Product');
  add(product.imageURL, 'Product');

  ['imageUrls', 'galleryImages', 'photos'].forEach(key => {
    if (Array.isArray(product[key])) product[key].forEach((s, i) => add(s, `View ${i+1}`));
  });

  if (Array.isArray(product.variants)) {
    product.variants.forEach(v => {
      if (v.images) {
        add(v.images.productImage, v.color ? `${v.color}` : 'Product');
        add(v.images.modelImage, v.color ? `${v.color} on Model` : 'On Model');
      }
    });
  }

  return images;
}

// ── Normalize variants ──
function normalizeVariants(product) {
  const raw = Array.isArray(product?.variants) ? product.variants : [];
  const mainImg = product?.images?.productImage || product?.image || product?.imageUrl || '';
  const mainModel = product?.images?.modelImage || product?.modelImage || mainImg;

  const stored = raw.filter(v => String(v?.color || '').trim()).map((v, i) => ({
    id: String(v.id || v.color || i).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-'),
    color: String(v.color || '').trim(),
    stock: Number.isFinite(Number(v.stock)) ? Number(v.stock) : Number(product.stock || 0),
    price: v.price || null,
    images: {
      productImage: v?.images?.productImage || v?.productImage || v?.image || v?.imageUrl || '',
      modelImage: v?.images?.modelImage || v?.modelImage || ''
    },
    sizes: v?.sizes || []
  }));

  const mainColor = String(product?.color || '').trim();
  if (isUsableUrl(mainImg)) {
    const covered = mainColor && stored.some(v => v.color.toLowerCase() === mainColor.toLowerCase());
    if (!covered) {
      stored.unshift({
        id: mainColor ? mainColor.toLowerCase().replace(/[^a-z0-9]+/g, '-') : '__main__',
        color: mainColor || (stored.length ? 'Default' : ''),
        stock: Number(product.stock || 0),
        price: null,
        images: { productImage: mainImg, modelImage: mainModel },
        sizes: product?.sizes || []
      });
    }
  }
  return stored;
}

// ── Dynamic detail fields ──
const DETAIL_FIELD_MAP = [
  { key: 'material', label: 'Material' },
  { key: 'finish', label: 'Finish' },
  { key: 'weight', label: 'Weight' },
  { key: 'diamonds', label: 'Diamonds' },
  { key: 'stones', label: 'Stones' },
  { key: 'closureType', label: 'Closure' },
  { key: 'occasion', label: 'Occasion' },
  { key: 'collection', label: 'Collection' },
  { key: 'length', label: 'Length' },
  { key: 'width', label: 'Width' },
  { key: 'height', label: 'Height' },
  { key: 'plating', label: 'Plating' },
  { key: 'baseMetal', label: 'Base Metal' },
  { key: 'color', label: 'Color' },
  { key: 'clarity', label: 'Clarity' },
  { key: 'carat', label: 'Carat' },
  { key: 'shape', label: 'Shape' },
  { key: 'style', label: 'Style' },
  { key: 'type', label: 'Type' }
];

function buildDetailRows(product) {
  const rows = [];
  DETAIL_FIELD_MAP.forEach(f => {
    if (product[f.key] !== undefined && product[f.key] !== null && String(product[f.key]).trim() !== '') {
      rows.push({ label: f.label, value: String(product[f.key]) });
    }
  });
  if (Array.isArray(product.details)) {
    product.details.forEach(d => {
      if (typeof d === 'string' && d.includes(':')) {
        const parts = d.split(':');
        rows.push({ label: parts[0].trim(), value: parts.slice(1).join(':').trim() });
      } else if (typeof d === 'string' && d.trim()) {
        rows.push({ label: '', value: d.trim() });
      } else if (typeof d === 'object' && d !== null) {
        if (d.label && d.value) rows.push({ label: d.label, value: d.value });
      }
    });
  }
  return rows;
}

// ── Main render: 100% data-driven ──
function renderProduct(product, docId) {
  if (!product) {
    setProductCtaReady(false);
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    return;
  }

  _currentProduct = product;
  _currentDocId = docId;

  const variants = normalizeVariants(product);
  if (variants.length && (!_selectedVariantId || !variants.some(v => v.id === _selectedVariantId))) {
    _selectedVariantId = variants[0].id;
  }
  const activeVariant = variants.find(v => v.id === _selectedVariantId) || variants[0] || null;

  const stock = activeVariant ? Number(activeVariant.stock) : Number(product.stock ?? 0);
  const inStock = stock > 0;
  const price = Number(activeVariant?.price || product.price || 0);
  const oldPrice = Number(product.oldPrice || product.compareAtPrice || product.mrp || 0);
  const discount = oldPrice > price ? Math.round(((oldPrice - price) / oldPrice) * 100) : 0;

  document.title = (product.name || 'Product') + ' – Chic Charms';
  document.getElementById('breadcrumbCategory').textContent = product.category || CATEGORY_LABELS[product.categorySlug] || 'Product';
  document.getElementById('productName').textContent = product.name || '';

  let priceHtml = `<p class="font-jost text-[24px] text-[#9F4C67] font-medium">${formatPrice(price)}</p>`;
  if (oldPrice > price) {
    priceHtml += `<span class="font-jost text-[14px] text-outline line-through ml-2">${formatPrice(oldPrice)}</span>`;
    if (discount > 0) priceHtml += `<span class="font-jost text-[12px] text-green-600 ml-2">${discount}% off</span>`;
  }
  document.getElementById('priceBlock').innerHTML = priceHtml;
  document.getElementById('stickyPrice').textContent = formatPrice(price);

  const rating = product.rating || null;
  const ratingBlock = document.getElementById('ratingBlock');
  if (rating) {
    ratingBlock.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span class="text-[14px] font-jost font-medium">${rating}</span>`;
    ratingBlock.style.display = '';
  } else {
    ratingBlock.style.display = 'none';
  }

  const desc = product.shortDescription || product.description || '';
  const descBlock = document.getElementById('descriptionBlock');
  if (desc) {
    descBlock.innerHTML = `<p id="productDescription" class="desc-clamped">${desc}</p>` +
      (desc.length > 120 ? `<button id="readMoreBtn" class="text-primary font-medium text-[14px] mt-1 underline underline-offset-4 decoration-primary/30" onclick="toggleDescription()">Read More</button>` : '');
    _descExpanded = false;
  } else {
    descBlock.innerHTML = '';
  }

  _galleryImages = extractAllImages(product, activeVariant);
  const gc = document.getElementById('galleryContainer');
  if (_galleryScrollListener) gc.removeEventListener('scroll', _galleryScrollListener);

  if (_galleryImages.length > 0) {
    gc.innerHTML = _galleryImages.map((img, i) =>
      `<div class="snap-center shrink-0 w-full h-full relative">
        <img class="w-full h-full object-cover" src="${img.src}" alt="${product.name} - ${img.label}" loading="${i === 0 ? 'eager' : 'lazy'}" />
      </div>`
    ).join('');
    let scrollTimeout;
    _galleryScrollListener = function() {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        const w = gc.offsetWidth;
        if (w > 0) {
          _selectedGalleryIndex = Math.round(gc.scrollLeft / w);
          updateGalleryDots();
        }
      }, 80);
    };
    gc.addEventListener('scroll', _galleryScrollListener, { passive: true });
  } else {
    gc.innerHTML = `<div class="snap-center shrink-0 w-full h-full relative bg-surface-container flex items-center justify-center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 13L2 9z"/><path d="M2 9h20"/></svg>
    </div>`;
  }
  _selectedGalleryIndex = 0;
  updateGalleryDots();

  const namedVariants = variants.filter(v => v.color && v.color !== 'Default' && v.id !== '__main__');
  const cs = document.getElementById('colorSelector');
  if (namedVariants.length > 1) {
    cs.classList.remove('hidden');
    document.getElementById('colorOptions').innerHTML = namedVariants.map(v =>
      `<button class="variant-btn ${v.id === activeVariant?.id ? 'active' : ''}" onclick="selectProductVariant('${v.id}')">${v.color}</button>`
    ).join('');
  } else { cs.classList.add('hidden'); }

  const sizes = activeVariant?.sizes || product.sizes || [];
  const ss = document.getElementById('sizeSelector');
  if (sizes.length > 0) {
    ss.classList.remove('hidden');
    document.getElementById('sizeOptions').innerHTML = sizes.map(s =>
      `<button class="variant-btn size-option ${_selectedSize === s ? 'active' : ''}" data-size="${s}" onclick="selectProductSize('${s}')">${s}</button>`
    ).join('');
  } else { ss.classList.add('hidden'); }

  const sb = document.getElementById('stockBadge');
  if (inStock) {
    sb.innerHTML = '<span class="dot" style="background:#22c55e;"></span> In Stock';
    sb.className = 'stock-badge text-green-600';
    document.getElementById('addToCartBtn').disabled = false;
    document.getElementById('stickyAddBtn').disabled = false;
  } else {
    sb.innerHTML = '<span class="dot" style="background:#ef4444;"></span> Out of Stock';
    sb.className = 'stock-badge text-red-600';
    document.getElementById('addToCartBtn').disabled = true;
    document.getElementById('stickyAddBtn').disabled = true;
  }

  const detailRows = buildDetailRows(product);
  const das = document.getElementById('detailsAccordionSection');
  if (detailRows.length > 0) {
    das.classList.remove('hidden');
    document.getElementById('productDetailsContent').innerHTML = detailRows.map(r =>
      `<div class="detail-row"><p class="detail-label">${r.label}</p><p class="detail-value">${r.value}</p></div>`
    ).join('');
  } else { das.classList.add('hidden'); }

  const care = product.careInstructions || product.care || [];
  const cas = document.getElementById('careAccordionSection');
  if (Array.isArray(care) && care.length > 0) {
    cas.classList.remove('hidden');
    document.getElementById('careContent').innerHTML = care.map(c => `<p>• ${c}</p>`).join('');
  } else if (typeof care === 'string' && care.trim()) {
    cas.classList.remove('hidden');
    document.getElementById('careContent').innerHTML = `<p>${care}</p>`;
  } else { cas.classList.add('hidden'); }

  checkWishlist();

  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('productContent').classList.remove('hidden');
  setProductCtaReady(true);
}

// ── Cart ──
window.handleAddToCart = function() {
  if (!_currentProduct) return;
  const cart = getCart();
  const price = Number(_currentProduct.price) || 0;
  const image = _currentProduct.images?.productImage || _currentProduct.image || '';
  const item = { id: _currentDocId, name: _currentProduct.name, price, image, variant: _selectedVariantId, size: _selectedSize, quantity: 1 };
  const idx = cart.findIndex(i => i.id === item.id && i.variant === item.variant && i.size === item.size);
  if (idx > -1) cart[idx].quantity = (cart[idx].quantity || 1) + 1;
  else cart.push(item);
  saveCart(cart);
  showToast('Added to cart!');
  if (_currentDocId && _currentDocId !== 'demo-product' && window.addToCartWithId) {
    window.addToCartWithId(_currentProduct.name, price, _currentDocId);
  }
};

// ── Wishlist ──
function checkWishlist() {
  const inW = window.CCWishlist && window.CCWishlist.has(_currentDocId);
  const fab = document.getElementById('wishlistFab');
  if (fab) {
    fab.classList.toggle('wishlisted', inW);
    fab.classList.toggle('active', inW);
  }
}

window.toggleWishlist = function() {
  if (!_currentDocId || !window.CCWishlist) return;
  const product = {
    id: _currentDocId,
    name: _currentProduct?.name || '',
    price: _currentProduct?.price || 0,
    image: _currentProduct?.images?.productImage || _currentProduct?.image || '',
    category: _currentProduct?.category || ''
  };
  window.CCWishlist.toggle(product);
  checkWishlist();
};

// ── Firebase load ──
async function loadProduct() {
  const urlParams = new URLSearchParams(window.location.search);
  const productId = urlParams.get('id');

  if (!productId) {
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    document.querySelector('#errorState p').textContent = 'No product specified. Please navigate from the shop page.';
    return;
  }

  let _rendered = false;
  const _safety = setTimeout(() => {
    if (!_rendered) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.querySelector('#errorState p').textContent = 'Product load timed out. Tap Retry.';
    }
  }, 10000);

  try {
    const _url = 'https://firestore.googleapis.com/v1/projects/chic-charms-store/databases/(default)/documents/products/'
      + encodeURIComponent(productId)
      + '?key=AIzaSyA5Bh77_4HE3yQF0hi5ddvbFLZC7rEerxg';
    const _res  = await fetch(_url);
    clearTimeout(_safety);
    if (!_res.ok) throw new Error('HTTP ' + _res.status);
    const _doc = await _res.json();
    if (_doc.error)  throw new Error(_doc.error.message || 'Firestore error');
    if (!_doc.fields) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.querySelector('#errorState p').textContent = 'Product not found.';
      return;
    }
    function _cv(v) {
      if (!v) return null;
      if ('stringValue'    in v) return v.stringValue;
      if ('integerValue'   in v) return Number(v.integerValue);
      if ('doubleValue'    in v) return Number(v.doubleValue);
      if ('booleanValue'   in v) return v.booleanValue;
      if ('nullValue'      in v) return null;
      if ('timestampValue' in v) return new Date(v.timestampValue);
      if ('arrayValue'     in v) return (v.arrayValue.values || []).map(_cv);
      if ('mapValue'       in v) {
        const o = {};
        for (const [k,w] of Object.entries(v.mapValue.fields || {})) o[k] = _cv(w);
        return o;
      }
      return null;
    }
    const _product = {};
    for (const [k,v] of Object.entries(_doc.fields)) _product[k] = _cv(v);
    try {
      renderProduct(_product, productId);
      _rendered = true;
    } catch(renderErr) {
      console.error('[PDP] renderProduct error:', renderErr);
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.querySelector('#errorState p').textContent = 'Display error. Please tap Retry.';
    }
  } catch (error) {
    clearTimeout(_safety);
    console.error('[PDP] load error:', error);
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    document.querySelector('#errorState p').textContent = 'Could not load product. Please check your connection.';
  }

  loadRelatedProducts(productId);
}

// ── Related products from Firestore ──
async function loadRelatedProducts(currentProductId) {
  const section = document.getElementById('relatedSection');
  const container = document.getElementById('relatedProducts');
  const title = document.getElementById('relatedTitle');

  try {
    if (typeof firebase === 'undefined') return;
    const db = firebase.firestore();
    let related = [];

    if (_currentProduct?.relatedProducts && Array.isArray(_currentProduct.relatedProducts)) {
      for (const rid of _currentProduct.relatedProducts.slice(0, 8)) {
        try {
          const doc = await db.collection('products').doc(String(rid)).get();
          if (doc.exists && doc.id !== currentProductId) related.push({ ...doc.data(), _id: doc.id });
        } catch(e) {}
      }
    }

    if (related.length < 4 && _currentProduct?.categorySlug) {
      const snap = await db.collection('products').where('categorySlug', '==', _currentProduct.categorySlug).limit(6).get();
      snap.forEach(doc => {
        if (doc.id !== currentProductId && !related.some(r => r._id === doc.id)) {
          related.push({ ...doc.data(), _id: doc.id });
        }
      });
    }

    if (related.length < 3) {
      const snap = await db.collection('products').limit(8).get();
      snap.forEach(doc => {
        if (doc.id !== currentProductId && !related.some(r => r._id === doc.id)) {
          related.push({ ...doc.data(), _id: doc.id });
        }
      });
    }

    if (related.length > 0) {
      title.textContent = 'You May Also Love';
      container.innerHTML = related.slice(0, 6).map(p => {
        const img = p.images?.productImage || p.image || p.imageUrl || '';
        const pUrl = `product.html?id=${p._id}`;
        return `<a href="${pUrl}" class="snap-start shrink-0 w-[240px] block">
          <div class="aspect-[4/5] bg-surface-container mb-3 overflow-hidden">
            ${isUsableUrl(img) ? `<img class="w-full h-full object-cover active:scale-105 transition-transform duration-500" src="${img}" alt="${p.name || ''}" loading="lazy" />` : `<div class="w-full h-full bg-surface-container flex items-center justify-center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 13L2 9z"/><path d="M2 9h20"/></svg></div>`}
          </div>
          <p class="font-jost text-[14px] uppercase tracking-wide mb-1">${p.name || 'Product'}</p>
          <p class="font-jost text-[#9F4C67]">${formatPrice(p.price)}</p>
        </a>`;
      }).join('');
      section.classList.remove('hidden');
    } else {
      section.classList.add('hidden');
    }
  } catch (e) {
    section.classList.add('hidden');
  }
}

  document.getElementById('footerAccordion').innerHTML = SITE_CONFIG.footerNav.map(group =>

      <button class="w-full py-6 flex justify-between items-center group" onclick="this.parentElement.classList.toggle('accordion-open')">
        <span class="font-label-caps text-[11px] tracking-[0.2em] uppercase">${group.title}</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="accordion-content">
        <ul class="pb-6 flex flex-col gap-3 text-[13px] text-brand-ivory/60">
          ${group.links.map(l => `<li><a href="${l.href}">${l.label}</a></li>`).join('')}
        </ul>

  // Drawer nav
  const navItems = SITE_CONFIG.navigation.map(n => `<a href="${n.href}" class="font-jost text-on-surface hover:text-primary transition-colors">${n.label}</a>`);
  navItems.push('<div class="border-t border-outline-variant pt-5 mt-5"><a href="account.html" class="font-jost text-on-surface hover:text-primary transition-colors">My Account</a></div>');
  navItems.push('<a href="about.html" class="font-jost text-on-surface-variant text-[13px] hover:text-primary transition-colors">About Us</a>');
  navItems.push('<a href="contact.html" class="font-jost text-on-surface-variant text-[13px] hover:text-primary transition-colors">Contact</a>');
  document.getElementById('drawerNav').innerHTML = navItems.join('');
}

<script>
// Chic Charms – Global Nav Link Sanitizer (fixes rejected shop / wishlist redirects)
(function(){
  function fix(){
    document.querySelectorAll('a[href]').forEach(a=>{
      let h = a.getAttribute('href')||'';
      if(h.includes('mobile-home.html')) a.setAttribute('href','index.html');
      const txt = (a.textContent||'').trim().toLowerCase();
      if(txt==='shop' || txt==='best sellers' || txt==='best sellers'){ if(h.startsWith('#')) a.setAttribute('href','shop.html'); }
      if(txt==='about'){ if(h.startsWith('#')) a.setAttribute('href','about.html'); }
      if(txt==='reviews'){ if(h.startsWith('#')) a.setAttribute('href','index.html#testimonials'); }
      if(txt==='cart' && !h.includes('cart.html')) a.setAttribute('href','cart.html');
      if(txt==='search' && !h.includes('search.html')) a.setAttribute('href','search.html');
      if(txt==='wishlist' && !h.includes('wishlist.html')) a.setAttribute('href','wishlist.html');
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fix);
  else fix();
  new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
