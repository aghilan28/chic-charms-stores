<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#B5657A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Product details – Chic Charms" />
  <title>Product – Chic Charms</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Global Header (same as Home Page) -->
  <link rel="stylesheet" href="cc-global-header.css" />
  <link rel="stylesheet" href="cc-material-icons.css" />

  <!-- Mobile Product Styles -->
  <link rel="stylesheet" href="mobile-product.css" />

  <style>
    /* Material Symbols sizing — do not override visibility */
    .material-symbols-outlined { font-size: 20px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Accordion */
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .accordion-open .accordion-content { max-height: 500px; }

    /* SCROLL FIX */
    html {
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      font-size: 16px;
    }
    body {
      overflow-x: hidden;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }

    /* Gallery */
    #galleryContainer {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
    }

    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, #f6eceb 25%, #fcf1f1 50%, #f6eceb 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f1a1b;
      color: white;
      padding: 12px 24px;
      border-radius: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Gallery dots */
    .gallery-dots {
      position: absolute;
      bottom: 16px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 10;
    }
    .gallery-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transition: all 0.3s ease;
      border: none; padding: 0; cursor: pointer;
    }
    .gallery-dot.active {
      background: white;
      width: 20px;
      border-radius: 3px;
    }

    /* Description clamp */
    .desc-clamped { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .desc-expanded { display: block; }

    /* FAB */
    .fab-circle {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.80);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      color: #8e4559;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: none; cursor: pointer;
      transition: transform 0.15s ease;
    }
    .fab-circle:active { transform: scale(0.95); }
    .fab-circle.wishlisted svg path {
      fill: #B5657A;
      stroke: #B5657A;
    }

    /* Variant buttons */
    .variant-btn {
      padding: 8px 16px;
      border: 1px solid #857276;
      font-size: 13px;
      font-family: 'Jost', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      background: transparent;
      color: #1f1a1b;
      transition: all 0.2s ease;
    }
    .variant-btn:hover { border-color: #8e4559; }
    .variant-btn.active {
      background: #8e4559;
      color: white;
      border-color: #8e4559;
    }

    /* Stock badge */
    .stock-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-family: 'Jost', sans-serif;
    }
    .stock-badge .dot { width: 6px; height: 6px; border-radius: 50%; }

    /* Editorial overlay */
    .editorial-overlay {
      background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 50%);
    }

    /* Promise icon — now SVG-based, not font-based */
    .promise-icon-wrap {
      color: #8e4559;
      width: 28px;
      height: 28px;
      display: block;
      margin: 0 auto 8px;
    }
    .promise-icon-wrap svg {
      width: 28px;
      height: 28px;
    }

    /* Trust bar icon — inline SVG */
    .trust-icon-wrap {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #8e4559;
      flex-shrink: 0;
    }
    .trust-icon-wrap svg {
      width: 16px;
      height: 16px;
    }

    /* Sticky Product CTA geometry lives in product-sticky-cta.css. */

    /* Detail row */
    .detail-row { display: flex; flex-direction: column; }
    .detail-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: #534346; margin-bottom: 4px;
    }
    .detail-value { font-size: 14px; color: #1f1a1b; line-height: 1.5; }

    /* Hide sections until data loads */
    .data-section { display: none; }
    .data-section.has-data { display: block; }

    /* Hover zoom styling */
    .zoom-wrapper {
      overflow: hidden;
      position: relative;
      cursor: zoom-in;
    }
    .zoom-wrapper img {
      transition: transform 0.1s ease-out;
      transform-origin: center center;
    }

  </style>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "error-container": "#ffdad6",
            "error": "#ba1a1a",
            "secondary": "#95445e",
            "outline": "#857276",
            "primary-container": "#ab5d71",
            "inverse-surface": "#342f2f",
            "surface-bright": "#fff8f7",
            "tertiary": "#615a5d",
            "primary": "#8e4559",
            "surface-container-highest": "#eae0e0",
            "background": "#fff8f7",
            "surface-variant": "#eae0e0",
            "on-primary-fixed-variant": "#743044",
            "surface-container-low": "#fcf1f1",
            "on-background": "#1f1a1b",
            "surface-container": "#f6eceb",
            "on-secondary": "#ffffff",
            "surface-dim": "#e1d8d7",
            "on-surface-variant": "#534346",
            "on-primary": "#ffffff",
            "outline-variant": "#d7c1c5",
            "inverse-primary": "#ffb1c3",
            "primary-fixed": "#ffd9e0",
            "surface-container-high": "#f0e6e5",
            "surface-container-lowest": "#ffffff",
            "surface": "#fff8f7",
            "on-surface": "#1f1a1b",
            "brand-gold": "#B5657A",
            "brand-ivory": "#FFF9F7",
            "brand-dark": "#2F2A2A"

            "gutter_mobile": "12px",
            "header_height": "68px",
            "section_gap": "64px",
            "stack_gap_md": "16px",
            "margin_mobile": "20px"

          fontFamily: {
            "display-lg": ["Playfair Display"],
            "button": ["Plus Jakarta Sans"],
            "headline-md": ["Playfair Display"],
            "body-md": ["Plus Jakarta Sans"],
            "headline-lg": ["Playfair Display"],
            "label-caps": ["Plus Jakarta Sans"],
            "jost": ["Jost", "sans-serif"]
          },
          fontSize: {
            "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
            "button": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
            "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "500"}],
            "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600"}]
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="cc-bottom-nav.css" />
  <link rel="stylesheet" href="product-sticky-cta.css" />
  <style>
    @media (max-width: 767px) {
      .cc-bottom-nav, #cc-bottom-nav-wrapper, .mobile-bottom-nav {
        display: none !important;
      }
      body.cc-nav-active {
        padding-bottom: 0 !important;
      }
      body.cc-product-page main,
      body.cc-product-page.cc-product-cta-ready main {
        padding-bottom: 0 !important;
      }
      #stickyBar.cc-product-sticky-cta {
        bottom: 0 !important;
      }
      #galleryDotsMobile {
        bottom: 16px !important;
        z-index: 20 !important;
      }
      #galleryDotsMobile .gallery-dot {
        background: rgba(181, 101, 122, 0.3) !important;
      }
      #galleryDotsMobile .gallery-dot.active {
        background: #B5657A !important;
      }
    }

    /* Glowing stock pulse animation */
    @keyframes stockPulse {
      0% {
        transform: scale(0.92);
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 6px rgba(34, 197, 94, 0);
      }
      100% {
        transform: scale(0.92);
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }
    .stock-pulse-dot {
      animation: stockPulse 2s infinite !important;
      display: inline-block;
      border-radius: 50%;
    }

    /* Color swatch button styling */
    .color-swatch-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 0;
      outline: none;
    }
    .color-swatch-btn.active {
      box-shadow: 0 0 0 2.5px #ffffff, 0 0 0 4.5px #8e4559;
    }
    .color-swatch-btn:focus-visible {
      box-shadow: 0 0 0 2.5px #ffffff, 0 0 0 4.5px #8e4559;
    }

    /* Smooth page fade-in upload animation */
    @keyframes pageUploadFadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-in {
      animation: pageUploadFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    }
  </style>
  <link rel="icon" type="image/png" href="favicon.png"/>

<body class="cc-product-page bg-surface text-on-surface font-body-md selection:bg-primary/20">

<div id="toast" class="toast"></div>

<!-- Global Header is injected by cc-global-header.js (identical to Home Page) -->

<main class="pb-0 md:pb-[140px]">
  <!-- Loading -->
  <div id="loadingState" class="px-margin_mobile">
    <div class="h-4 w-32 skeleton mb-4"></div>
    <div class="h-[500px] skeleton mb-6"></div>
    <div class="space-y-3">
      <div class="h-8 skeleton w-3/4"></div>
      <div class="h-6 skeleton w-1/3"></div>
      <div class="h-20 skeleton"></div>
      <div class="h-14 skeleton mt-6"></div>
    </div>
  </div>

  <!-- Product Content -->
  <div id="productContent" class="hidden opacity-0">
    <!-- DESKTOP-ONLY LAYOUT (md and up) -->
    <div class="hidden md:block">
      <!-- Breadcrumb -->
      <nav class="max-w-7xl mx-auto px-margin_mobile lg:px-8 py-4">
        <ol class="flex items-center gap-2 text-[13px] font-jost text-outline">
          <li><a class="hover:underline" href="index.html">Home</a></li>
          <li><span class="text-outline-variant">|</span></li>
          <li><span id="breadcrumbCategory" class="font-medium text-on-surface"></span></li>
        </ol>
      </nav>

      <!-- Main Responsive Grid Container -->
      <div class="max-w-7xl mx-auto lg:grid lg:grid-cols-12 lg:gap-16 lg:px-8 items-start">
        
        <!-- Left Column: Gallery (Sticky on desktop) -->
        <div class="lg:col-span-7 lg:sticky lg:top-28">
          <!-- Gallery -->
          <section class="relative">
            <div id="galleryContainer" class="flex snap-x snap-mandatory no-scrollbar h-[85vw] max-h-[618px] lg:h-[600px] lg:max-h-[600px]"></div>
            <div class="absolute top-6 right-6 flex flex-col gap-3 z-10">
              <button id="wishlistFab" class="fab-circle" onclick="toggleWishlist()" aria-label="Wishlist">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </button>
              <button class="fab-circle" onclick="shareProduct()" aria-label="Share">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              </button>
            </div>
            <div id="galleryDots" class="gallery-dots"></div>
          </section>
        </div>

        <!-- Right Column: Details and Purchase Actions -->
        <div class="lg:col-span-5 mt-6 lg:mt-0">
          <!-- Product Info -->
          <section class="px-margin_mobile lg:px-0 py-stack_gap_md lg:py-0">
            <h1 id="productName" class="font-headline-lg text-[34px] leading-tight text-on-surface mb-2"></h1>

            <div class="flex items-center justify-between mb-4">
              <div id="priceBlock"></div>
              <div id="ratingBlock" class="flex items-center gap-1 text-primary"></div>
            </div>

            <div id="descriptionBlock" class="text-on-surface-variant leading-relaxed text-[15px]"></div>

            <!-- Color Selector -->
            <div id="colorSelector" class="mt-6 hidden">
              <p class="font-label-caps text-[12px] tracking-widest uppercase mb-3">Color</p>
              <div id="colorOptions" class="flex flex-wrap gap-3"></div>
            </div>

            <!-- Size Selector -->
            <div id="sizeSelector" class="mt-6 hidden">
              <p class="font-label-caps text-[12px] tracking-widest uppercase mb-3">Size</p>
              <div id="sizeOptions" class="flex flex-wrap gap-3"></div>
            </div>

            <!-- Stock -->
            <div id="stockStatus" class="mt-4">
              <span id="stockBadge" class="stock-badge"></span>
            </div>

            <!-- Trust — uses inline SVGs, NOT material icon font names -->
            <div id="trustBar" class="mt-8 py-4 border-y border-outline-variant flex justify-between items-center text-[10px] font-label-caps tracking-widest text-on-surface-variant uppercase"></div>
          </section>

          <!-- Purchase Zone -->
          <section class="px-margin_mobile lg:px-0 py-6 flex flex-col gap-3">
            <button id="addToCartBtn" class="w-full h-14 bg-[#B5657A] text-white font-button text-[14px] tracking-widest uppercase active:scale-[0.98] transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed" onclick="handleAddToCart()">
              Add To Cart
            </button>
            <button class="w-full h-14 border border-[#B5657A] text-[#B5657A] font-button text-[14px] tracking-widest uppercase active:scale-[0.98] transition-all duration-300" onclick="buyNow()">
              Buy Now
            </button>
          </section>

          <!-- Accordion: Product Details (dynamic) -->
          <section id="detailsAccordionSection" class="px-margin_mobile lg:px-0 mt-4 hidden">
            <div class="accordion-item accordion-open border-t border-outline-variant">
              <button class="w-full py-5 flex justify-between items-center group" onclick="this.parentElement.classList.toggle('accordion-open')">
                <span class="font-headline-md text-[18px]">Product Details</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <div class="accordion-content">
                <div id="productDetailsContent" class="grid grid-cols-2 gap-y-6 gap-x-3 pb-8"></div>
              </div>
            </div>
          </section>

          <!-- Accordion: Care Instructions -->
          <section id="careAccordionSection" class="px-margin_mobile lg:px-0 hidden">
            <div class="accordion-item border-t border-outline-variant">
              <button class="w-full py-5 flex justify-between items-center group" onclick="this.parentElement.classList.toggle('accordion-open')">
                <span class="font-headline-md text-[18px]">Care Instructions</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <div class="accordion-content">
                <div id="careContent" class="pb-8 text-[14px] text-on-surface-variant leading-relaxed"></div>
              </div>
            </div>
          </section>

          <!-- Accordion: Shipping & Returns -->
          <section class="px-margin_mobile lg:px-0">
            <div class="accordion-item border-t border-outline-variant">
              <button class="w-full py-5 flex justify-between items-center group" onclick="this.parentElement.classList.toggle('accordion-open')">
                <span class="font-headline-md text-[18px]">Shipping &amp; Returns</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <div class="accordion-content">
                <div id="shippingContent" class="pb-8 text-[14px] text-on-surface-variant leading-relaxed"></div>
              </div>
            </div>
          </section>
        </div>

      </div>

      <!-- Gifting -->
      <section id="giftingSection" class="max-w-7xl mx-auto px-margin_mobile lg:px-8 py-section_gap hidden">
        <div class="bg-[#FAF5F2] p-8 text-center border border-outline-variant/30">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8e4559" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12v10H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
          <h3 id="giftingTitle" class="font-headline-md text-[20px] mb-2"></h3>
          <p id="giftingDesc" class="text-on-surface-variant text-[14px] mb-6"></p>
          <button id="giftingCta" class="font-label-caps text-[11px] tracking-widest text-primary border-b border-primary pb-1 uppercase"></button>
        </div>
      </section>

      <!-- Editorial -->
      <section id="editorialSection" class="relative w-full hidden lg:hidden">
        <div class="absolute inset-0 bg-black/25 z-10"></div>
        <img id="editorialImage" class="w-full h-full object-cover" alt="" loading="lazy" />
        <div class="absolute bottom-12 left-6 right-6 z-20">
          <h2 id="editorialTitle" class="font-display-lg text-white text-[32px] leading-tight mb-4"></h2>
          <span id="editorialCta" class="text-white font-label-caps text-[12px] tracking-widest uppercase flex items-center gap-2"></span>
        </div>
      </section>

      <!-- Promise -->
      <section id="promiseSection" class="max-w-7xl mx-auto px-margin_mobile lg:px-8 py-section_gap hidden">
        <div id="promiseGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-x-gutter_mobile lg:gap-x-12 gap-y-12"></div>
      </section>

      <!-- Related Section -->
      <section id="relatedSection" class="max-w-7xl mx-auto py-section_gap hidden px-margin_mobile lg:px-8">
        <h3 id="relatedTitle" class="font-headline-md text-[24px] mb-8 lg:px-0"></h3>
        <div id="relatedProducts" class="flex snap-x snap-mandatory no-scrollbar gap-4 lg:px-0" style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;"></div>
      </section>

      <!-- Footer -->
      <footer class="bg-brand-dark text-brand-ivory px-margin_mobile py-16">
        <div class="mb-12">
          <h2 class="font-display-lg text-[24px] tracking-[0.2em] mb-4">CHIC CHARMS</h2>
          <p id="footerTagline" class="text-[13px] text-brand-ivory/60 leading-relaxed max-w-[280px]"></p>
        </div>
        <div id="footerAccordion" class="flex flex-col border-t border-brand-ivory/10"></div>
        <div class="mt-12 text-[10px] text-brand-ivory/40 tracking-[0.1em] text-center">
          © <span id="footerYear"></span> CHIC CHARMS. ALL RIGHTS RESERVED.
        </div>
      </footer>
    </div>

    <!-- MOBILE-ONLY LAYOUT (md and down) -->
    <div class="block md:hidden">

function isUsableUrl(url) {
  if (!url || typeof url !== 'string') return false;
  const t = url.trim();
  return t.length > 0 && (t.startsWith('http://') || t.startsWith('https://') || t.startsWith('/') || t.startsWith('images/'));
}

function getCart() {

  window.dispatchEvent(new Event('cartUpdated'));

function updateCartBadges() {
  const cart = getCart();
  const count = cart.reduce((s, i) => s + (Number(i.quantity) || 1), 0);
  ['cartBadge', 'navCartBadge'].forEach(id => {
    const b = document.getElementById(id);
    if (b) { b.textContent = count > 9 ? '9+' : String(count); b.classList.toggle('hidden', count === 0); }

  const mobileCount = document.querySelector('.mobile-cart-count');
  if (mobileCount) {
    mobileCount.textContent = count > 9 ? '9+' : String(count);
    mobileCount.style.display = count > 0 ? '' : 'none';
  }
}

// ── Image extraction: support ANY image schema ──
function extractAllImages(product, variant) {
  const images = [];
  const seen = new Set();

  function add(src, label) {
    if (!isUsableUrl(src) || seen.has(src)) return;
    seen.add(src);
    images.push({ src, label });
  }

  if (variant) {
    if (variant.images) {
      add(variant.images.productImage, 'Product');
      add(variant.images.modelImage, 'On Model');
      add(variant.images.lifestyle, 'Lifestyle');
      add(variant.images.detail, 'Detail');
      add(variant.images.flat, 'Flat Lay');
      if (Array.isArray(variant.images.all)) variant.images.all.forEach((s, i) => add(s, `View ${i+1}`));
      if (Array.isArray(variant.images.gallery)) variant.images.gallery.forEach((s, i) => add(s, `View ${i+1}`));
    }
    add(variant.productImage, 'Product');
    add(variant.modelImage, 'On Model');
    add(variant.image, 'Product');
    add(variant.imageUrl, 'Product');
  }

  if (product.images) {
    add(product.images.productImage, 'Product');
    add(product.images.modelImage, 'On Model');
    add(product.images.lifestyle, 'Lifestyle');
    add(product.images.detail, 'Detail');
    add(product.images.flat, 'Flat Lay');
    if (Array.isArray(product.images.all)) product.images.all.forEach((s, i) => add(s, `View ${i+1}`));
    if (Array.isArray(product.images.gallery)) product.images.gallery.forEach((s, i) => add(s, `View ${i+1}`));
  }

  add(product.productImage, 'Product');
  add(product.image, 'Product');
  add(product.imageUrl, 'Product');
  add(product.imageURL, 'Product');

  ['imageUrls', 'galleryImages', 'photos'].forEach(key => {
    if (Array.isArray(product[key])) product[key].forEach((s, i) => add(s, `View ${i+1}`));
  });

  if (Array.isArray(product.variants)) {
    product.variants.forEach(v => {
      if (v.images) {
        add(v.images.productImage, v.color ? `${v.color}` : 'Product');
        add(v.images.modelImage, v.color ? `${v.color} on Model` : 'On Model');
      }
    });
  }

  return images;
}

// ── Normalize variants ──
function normalizeVariants(product) {
  const raw = Array.isArray(product?.variants) ? product.variants : [];
  const mainImg = product?.images?.productImage || product?.image || product?.imageUrl || '';
  const mainModel = product?.images?.modelImage || product?.modelImage || mainImg;

  const stored = raw.filter(v => String(v?.color || '').trim()).map((v, i) => ({
    id: String(v.id || v.color || i).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-'),
    color: String(v.color || '').trim(),
    stock: Number.isFinite(Number(v.stock)) ? Number(v.stock) : Number(product.stock || 0),
    price: v.price || null,
    images: {
      productImage: v?.images?.productImage || v?.productImage || v?.image || v?.imageUrl || '',
      modelImage: v?.images?.modelImage || v?.modelImage || ''
    },
    sizes: v?.sizes || []
  }));

  const mainColor = String(product?.color || '').trim();
  if (isUsableUrl(mainImg)) {
    const covered = mainColor && stored.some(v => v.color.toLowerCase() === mainColor.toLowerCase());
    if (!covered) {
      stored.unshift({
        id: mainColor ? mainColor.toLowerCase().replace(/[^a-z0-9]+/g, '-') : '__main__',
        color: mainColor || (stored.length ? 'Default' : ''),
        stock: Number(product.stock || 0),
        price: null,
        images: { productImage: mainImg, modelImage: mainModel },
        sizes: product?.sizes || []
      });
    }
  }
  return stored;
}

// ── Dynamic detail fields ──
const DETAIL_FIELD_MAP = [
  { key: 'material', label: 'Material' },
  { key: 'finish', label: 'Finish' },
  { key: 'weight', label: 'Weight' },
  { key: 'diamonds', label: 'Diamonds' },
  { key: 'stones', label: 'Stones' },
  { key: 'closureType', label: 'Closure' },
  { key: 'occasion', label: 'Occasion' },
  { key: 'collection', label: 'Collection' },
  { key: 'length', label: 'Length' },
  { key: 'width', label: 'Width' },
  { key: 'height', label: 'Height' },
  { key: 'plating', label: 'Plating' },
  { key: 'baseMetal', label: 'Base Metal' },
  { key: 'color', label: 'Color' },
  { key: 'clarity', label: 'Clarity' },
  { key: 'carat', label: 'Carat' },
  { key: 'shape', label: 'Shape' },
  { key: 'style', label: 'Style' },
  { key: 'type', label: 'Type' }
];

function buildDetailRows(product) {
  const rows = [];
  DETAIL_FIELD_MAP.forEach(f => {
    if (product[f.key] !== undefined && product[f.key] !== null && String(product[f.key]).trim() !== '') {
      rows.push({ label: f.label, value: String(product[f.key]) });
    }
  });
  if (Array.isArray(product.details)) {
    product.details.forEach(d => {
      if (typeof d === 'string' && d.includes(':')) {
        const parts = d.split(':');
        rows.push({ label: parts[0].trim(), value: parts.slice(1).join(':').trim() });
      } else if (typeof d === 'string' && d.trim()) {
        rows.push({ label: '', value: d.trim() });
      } else if (typeof d === 'object' && d !== null) {
        if (d.label && d.value) rows.push({ label: d.label, value: d.value });
      }
    });
  }
  return rows;
}

// ── Main render: 100% data-driven ──
function renderProduct(product, docId) {
  if (!product) {
    setProductCtaReady(false);
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    return;
  }

  _currentProduct = product;
  _currentDocId = docId;

  const variants = normalizeVariants(product);
  if (variants.length && (!_selectedVariantId || !variants.some(v => v.id === _selectedVariantId))) {
    _selectedVariantId = variants[0].id;
  }
  const activeVariant = variants.find(v => v.id === _selectedVariantId) || variants[0] || null;

  const stock = activeVariant ? Number(activeVariant.stock) : Number(product.stock ?? 0);
  const inStock = stock > 0;
  const price = Number(activeVariant?.price || product.price || 0);
  const oldPrice = Number(product.oldPrice || product.compareAtPrice || product.mrp || 0);
  const discount = oldPrice > price ? Math.round(((oldPrice - price) / oldPrice) * 100) : 0;

  document.title = (product.name || 'Product') + ' – Chic Charms';
  document.getElementById('breadcrumbCategory').textContent = product.category || CATEGORY_LABELS[product.categorySlug] || 'Product';
  document.getElementById('productName').textContent = product.name || '';

  let priceHtml = `<p class="font-jost text-[24px] text-[#9F4C67] font-medium">${formatPrice(price)}</p>`;
  if (oldPrice > price) {
    priceHtml += `<span class="font-jost text-[14px] text-outline line-through ml-2">${formatPrice(oldPrice)}</span>`;
    if (discount > 0) priceHtml += `<span class="font-jost text-[12px] text-green-600 ml-2">${discount}% off</span>`;
  }
  document.getElementById('priceBlock').innerHTML = priceHtml;
  document.getElementById('stickyPrice').textContent = formatPrice(price);

  const rating = product.rating || null;
  const ratingBlock = document.getElementById('ratingBlock');
  if (rating) {
    ratingBlock.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span class="text-[14px] font-jost font-medium">${rating}</span>`;
    ratingBlock.style.display = '';
  } else {
    ratingBlock.style.display = 'none';
  }

  const desc = product.shortDescription || product.description || '';
  const descBlock = document.getElementById('descriptionBlock');
  if (desc) {
    descBlock.innerHTML = `<p id="productDescription" class="desc-clamped">${desc}</p>` +
      (desc.length > 120 ? `<button id="readMoreBtn" class="text-primary font-medium text-[14px] mt-1 underline underline-offset-4 decoration-primary/30" onclick="toggleDescription()">Read More</button>` : '');
    _descExpanded = false;
  } else {
    descBlock.innerHTML = '';
  }

  _galleryImages = extractAllImages(product, activeVariant);
  const gc = document.getElementById('galleryContainer');
  if (_galleryScrollListener) gc.removeEventListener('scroll', _galleryScrollListener);

  if (_galleryImages.length > 0) {
    gc.innerHTML = _galleryImages.map((img, i) =>
      `<div class="snap-center shrink-0 w-full h-full relative zoom-wrapper">
        <img class="w-full h-full object-cover zoom-img" src="${img.src}" alt="${product.name} - ${img.label}" loading="${i === 0 ? 'eager' : 'lazy'}" style="transform-origin: center center; transition: transform 0.08s ease-out; cursor: zoom-in;" />
      </div>`
    ).join('');

    // Bind inline hover & click zoom listeners (Amazon style)
    gc.querySelectorAll('.zoom-wrapper').forEach(wrapper => {
      const img = wrapper.querySelector('.zoom-img');
      let isZoomed = false;
      let rect = null;

      if (img) {
        img.style.willChange = 'transform, transform-origin';
      }

      wrapper.addEventListener('mouseenter', () => {
        rect = wrapper.getBoundingClientRect();
        if (img) img.style.transition = 'transform 0.15s ease-out';
      });

      wrapper.addEventListener('mousemove', (e) => {
        if (!img) return;
        if (!rect) rect = wrapper.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        img.style.transition = 'none';
        img.style.transformOrigin = `${x}% ${y}%`;
        img.style.transform = isZoomed ? 'scale(3.5)' : 'scale(2.2)';
      });

      wrapper.addEventListener('mouseleave', () => {
        if (!img) return;
        img.style.transition = 'transform 0.15s ease-out';
        img.style.transform = 'scale(1)';
        img.style.transformOrigin = 'center center';
        isZoomed = false;
        img.style.cursor = 'zoom-in';
        rect = null;
      });

      wrapper.addEventListener('click', (e) => {
        if (!img) return;
        isZoomed = !isZoomed;
        img.style.cursor = isZoomed ? 'zoom-out' : 'zoom-in';
        img.style.transition = 'transform 0.15s ease-out';
        if (rect) {
          const x = ((e.clientX - rect.left) / rect.width) * 100;
          const y = ((e.clientY - rect.top) / rect.height) * 100;
          img.style.transformOrigin = `${x}% ${y}%`;
          img.style.transform = isZoomed ? 'scale(3.5)' : 'scale(2.2)';
        }
      });
    });

    let scrollTimeout;
    _galleryScrollListener = function() {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        const w = gc.offsetWidth;
        if (w > 0) {
          _selectedGalleryIndex = Math.round(gc.scrollLeft / w);
          updateGalleryDots();
        }
      }, 80);
    };
    gc.addEventListener('scroll', _galleryScrollListener, { passive: true });
  } else {
    gc.innerHTML = `<div class="snap-center shrink-0 w-full h-full relative bg-surface-container flex items-center justify-center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 13L2 9z"/><path d="M2 9h20"/></svg>
    </div>`;
  }
  _selectedGalleryIndex = 0;
  updateGalleryDots();

  const COLOR_HEX_MAP = {
    'gold': '#E6C15C',
    'silver': '#E5E5E5',
    'rose gold': '#E7B2B2',
    'white': '#FFFFFF',
    'black': '#1E1E1E',
    'emerald': '#097969',
    'green': '#22C55E',
    'red': '#EF4444',
    'blue': '#3B82F6',
    'pink': '#F472B6',
    'tan': '#D2B48C',
    'brown': '#8B4513',
    'beige': '#F5F5DC',
    'grey': '#8A8080',
    'gray': '#8A8080',
    'yellow': '#FACC15',
    'purple': '#A855F7',
    'orange': '#F97316'
  };
  function getColorHex(colorName) {
    if (!colorName) return '#E5E5E5';
    const c = colorName.trim().toLowerCase();
    
    if (c.includes('rose gold') || c.includes('rose-gold')) return '#E7B2B2';
    if (c.includes('gold')) return '#E6C15C';
    if (c.includes('silver')) return '#E5E5E5';
    if (c.includes('emerald')) return '#097969';
    if (c.includes('aqua')) return '#4DAF9C';
    if (c.includes('green')) return '#22C55E';
    if (c.includes('blue')) return '#3B82F6';
    if (c.includes('red')) return '#EF4444';
    if (c.includes('pink')) return '#F472B6';
    if (c.includes('brown')) return '#8B4513';
    if (c.includes('beige')) return '#F5F5DC';
    if (c.includes('black')) return '#1E1E1E';
    if (c.includes('white')) return '#FFFFFF';
    if (c.includes('grey') || c.includes('gray')) return '#8A8080';
    if (c.includes('yellow')) return '#FACC15';
    if (c.includes('purple')) return '#A855F7';
    if (c.includes('orange')) return '#F97316';

    return COLOR_HEX_MAP[c] || c;
  }

  const namedVariants = variants.filter(v => v.color && v.color.toLowerCase() !== 'default');
  const cs = document.getElementById('colorSelector');
  if (namedVariants.length >= 1) {
    cs.classList.remove('hidden');
    document.getElementById('colorOptions').innerHTML = namedVariants.map(v => {
      const hex = getColorHex(v.color);
      return `<button class="color-swatch-btn ${v.id === activeVariant?.id ? 'active' : ''}" style="background-color: ${hex};" onclick="selectProductVariant('${v.id}')" title="${v.color}"></button>`;
    }).join('');
  } else { cs.classList.add('hidden'); }

  const sizes = activeVariant?.sizes || product.sizes || [];
  const ss = document.getElementById('sizeSelector');
  if (sizes.length > 0) {
    ss.classList.remove('hidden');
    document.getElementById('sizeOptions').innerHTML = sizes.map(s =>
      `<button class="variant-btn size-option ${_selectedSize === s ? 'active' : ''}" data-size="${s}" onclick="selectProductSize('${s}')">${s}</button>`
    ).join('');
  } else { ss.classList.add('hidden'); }

  const sb = document.getElementById('stockBadge');
  const mAdd = document.getElementById('mobileAddToCartBtn');
  const mBuy = document.getElementById('mobileBuyNowBtn');
  const mText = document.getElementById('mobileAddToCartText');

  if (inStock) {
    sb.innerHTML = '<span class="dot stock-pulse-dot" style="background:#22c55e;"></span> In Stock';
    sb.className = 'stock-badge text-green-600';
    document.getElementById('addToCartBtn').disabled = false;
    document.getElementById('stickyAddBtn').disabled = false;
    if (mAdd && mBuy) {
      mAdd.disabled = false;
      mAdd.style.opacity = '';
      mAdd.style.pointerEvents = '';
      if (mText) mText.textContent = 'Add to Cart';
      
      mBuy.disabled = false;
      mBuy.style.opacity = '';
      mBuy.style.pointerEvents = '';
    }
  } else {
    sb.innerHTML = '<span class="dot" style="background:#ef4444;"></span> Out of Stock';
    sb.className = 'stock-badge text-red-600';
    document.getElementById('addToCartBtn').disabled = true;
    document.getElementById('stickyAddBtn').disabled = true;
    if (mAdd && mBuy) {
      mAdd.disabled = true;
      mAdd.style.opacity = '0.5';
      mAdd.style.pointerEvents = 'none';
      if (mText) mText.textContent = 'Out of Stock';
      
      mBuy.disabled = true;
      mBuy.style.opacity = '0.5';
      mBuy.style.pointerEvents = 'none';
    }
  }

  const detailRows = buildDetailRows(product);
  const das = document.getElementById('detailsAccordionSection');
  if (detailRows.length > 0) {
    das.classList.remove('hidden');
    document.getElementById('productDetailsContent').innerHTML = detailRows.map(r =>
      `<div class="detail-row"><p class="detail-label">${r.label}</p><p class="detail-value">${r.value}</p></div>`
    ).join('');
  } else { das.classList.add('hidden'); }

  const care = product.careInstructions || product.care || [];
  const cas = document.getElementById('careAccordionSection');
  if (Array.isArray(care) && care.length > 0) {
    cas.classList.remove('hidden');
    document.getElementById('careContent').innerHTML = care.map(c => `<p>• ${c}</p>`).join('');
  } else if (typeof care === 'string' && care.trim()) {
    cas.classList.remove('hidden');
    document.getElementById('careContent').innerHTML = `<p>${care}</p>`;
  } else { cas.classList.add('hidden'); }

  checkWishlist();
  syncMobilePDP();

  document.getElementById('loadingState').classList.add('hidden');
  const pc = document.getElementById('productContent');
  pc.classList.remove('hidden');
  pc.classList.add('animate-fade-in');
  setProductCtaReady(true);
}

window.handleAddToCart = function() {
  if (!_currentProduct) return;

  const cart = getCart();
  const variants = _currentProduct ? normalizeVariants(_currentProduct) : [];
  const namedVariants = variants.filter(v => v.color && v.color.toLowerCase() !== 'default');
  const hasColors = namedVariants.length >= 1;
  const targetVariant = hasColors ? (_selectedVariantId || '') : (_selectedVariantId || 'Gold Finish');
  const targetSize = _selectedSize || '';

  const idx = cart.findIndex(i => 
    (i.id === _currentDocId || i.productId === _currentDocId) && 
    (i.variant || '') === targetVariant && 
    (i.size || '') === targetSize
  );

  const stockVal = Number(_currentProduct.stock ?? 0);
  const currentQty = idx > -1 ? (cart[idx].quantity || 0) : 0;

  if (currentQty >= stockVal) {
    showToast('Out of stock or limit reached');
    return;
  }

  const price = Number(_currentProduct.price) || 0;
  if (_currentDocId && _currentDocId !== 'demo-product' && window.addToCartWithId) {
    window.addToCartWithId(_currentProduct.name, price, _currentDocId, _selectedVariantId, _selectedSize);
  } else {
    // Fallback if script.js not fully loaded or demo product
    const image = _currentProduct.images?.productImage || _currentProduct.image || '';
    const item = { id: _currentDocId || 'demo-product', productId: _currentDocId || 'demo-product', name: _currentProduct.name, price, image, variant: _selectedVariantId, size: _selectedSize, quantity: 1 };
    if (idx > -1) {
      cart[idx].quantity = currentQty + 1;
    } else {
      cart.push(item);
    }
    saveCart(cart);
    showToast('Added to cart!');
    window.dispatchEvent(new Event('cartUpdated'));
  }
  // Delayed state updates
  setTimeout(() => { updateActionPillsState(); }, 500);
};

window.updateActionPillsState = function() {
  if (window.innerWidth >= 768) return;
  if (!_currentProduct) return;
  const cart = getCart();
  const variants = _currentProduct ? normalizeVariants(_currentProduct) : [];
  const namedVariants = variants.filter(v => v.color && v.color.toLowerCase() !== 'default');
  const hasColors = namedVariants.length >= 1;
  const targetVariant = hasColors ? (_selectedVariantId || '') : (_selectedVariantId || 'Gold Finish');
  const targetSize = _selectedSize || '';

  const idx = cart.findIndex(i => 
    (i.id === _currentDocId || i.productId === _currentDocId) && 
    (i.variant || '') === targetVariant && 
    (i.size || '') === targetSize
  );
  
  const defaultBlock = document.getElementById('defaultActionPills');
  const addedBlock = document.getElementById('addedActionPills');
  
  if (idx > -1) {
    const qty = cart[idx].quantity || 1;
    const addedCartBadge = document.getElementById('addedCartBadge');
    if (addedCartBadge) {
      const totalCount = cart.reduce((s, i) => s + (Number(i.quantity) || 1), 0);
      addedCartBadge.textContent = totalCount;
    }
    const addedCartQty = document.getElementById('addedCartQty');
    if (addedCartQty) addedCartQty.textContent = qty;
    
    defaultBlock?.classList.add('hidden');
    addedBlock?.classList.remove('hidden');
  } else {
    defaultBlock?.classList.remove('hidden');
    addedBlock?.classList.add('hidden');
  }
};

window.updateItemQty = function(delta) {
  if (!_currentProduct) return;
  const cart = getCart();
  const variants = _currentProduct ? normalizeVariants(_currentProduct) : [];
  const namedVariants = variants.filter(v => v.color && v.color.toLowerCase() !== 'default');
  const hasColors = namedVariants.length >= 1;
  const targetVariant = hasColors ? (_selectedVariantId || '') : (_selectedVariantId || 'Gold Finish');
  const targetSize = _selectedSize || '';

  const idx = cart.findIndex(i => 
    (i.id === _currentDocId || i.productId === _currentDocId) && 
    (i.variant || '') === targetVariant && 
    (i.size || '') === targetSize
  );
  if (idx > -1) {
    const newQty = (cart[idx].quantity || 1) + delta;
    const stockVal = Number(_currentProduct.stock ?? 0);
    if (delta > 0 && newQty > stockVal) {
      showToast('No more stock available');
      return;
    }
    if (newQty <= 0) {
      cart.splice(idx, 1);
    } else {
      cart[idx].quantity = newQty;
    }
    saveCart(cart);
    window.dispatchEvent(new Event('cartUpdated'));
    updateActionPillsState();
  }
};

// ── Mobile PDP Sync and Tab Controls ──
window.switchMobileTab = function(tab) {
  document.querySelectorAll('.cc-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  document.querySelectorAll('.cc-tab-content').forEach(content => {
    const targetId = `tabContent${tab.charAt(0).toUpperCase() + tab.slice(1)}`;
    content.classList.toggle('active', content.id === targetId);
    content.classList.toggle('hidden', content.id !== targetId);
  });
};

window.toggleRelatedWishlist = function(event, id) {
  event.preventDefault();
  event.stopPropagation();
  if (!window.CCWishlist) return;
  
  const btn = event.currentTarget;
  const wasSaved = btn.querySelector('svg').getAttribute('fill') === 'currentColor';
  
  const p = { id };
  window.CCWishlist.toggle(p);
  
  const svg = btn.querySelector('svg');
  if (wasSaved) {
    svg.setAttribute('fill', 'none');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
    showToast('Removed from wishlist');
  } else {
    svg.setAttribute('fill', 'currentColor');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
    showToast('Saved to wishlist');
  }
  
  checkWishlist();
};

function syncMobilePDP() {
  if (window.innerWidth >= 768) return;
  if (!_currentProduct) return;

  const variants = normalizeVariants(_currentProduct);
  const activeVariant = variants.find(v => v.id === _selectedVariantId) || variants[0] || null;
  const price = Number(activeVariant?.price || _currentProduct.price || 0);
  const oldPrice = Number(_currentProduct.oldPrice || _currentProduct.compareAtPrice || _currentProduct.mrp || (price ? Math.ceil(price * 1.28) : 0));

  // Category
  const catEl = document.getElementById('productCategoryMobile');
  if (catEl) catEl.textContent = _currentProduct.category || CATEGORY_LABELS[_currentProduct.categorySlug] || 'Earrings';

  // Name
  const nameEl = document.getElementById('productNameMobile');
  if (nameEl) nameEl.textContent = _currentProduct.name || '';

  const colNameMobile = document.getElementById('selectedColorNameMobile');
  if (colNameMobile) {
    colNameMobile.textContent = activeVariant?.color || '';
  }

  // Prices
  const priceEl = document.getElementById('productPriceMobile');
  if (priceEl) priceEl.textContent = formatPrice(price);

  const oldPriceEl = document.getElementById('productOldPriceMobile');
  if (oldPriceEl) {
    if (oldPrice > price) {
      oldPriceEl.textContent = formatPrice(oldPrice);
      oldPriceEl.style.display = '';
    } else {
      oldPriceEl.style.display = 'none';
    }
  }

  // Description
  const descEl = document.getElementById('descriptionBlockMobile');
  if (descEl) {
    const desc = _currentProduct.shortDescription || _currentProduct.description || '';
    descEl.innerHTML = `<p class="text-on-surface-variant leading-relaxed text-[15px]">${desc}</p>`;
  }

  // Gallery Container Mobile
  const galDest = document.getElementById('galleryContainerMobile');
  if (galDest && _galleryImages.length > 0) {
    galDest.innerHTML = _galleryImages.map((img, i) =>
      `<div class="snap-center shrink-0 w-full h-full relative flex items-center justify-center bg-gray-50 overflow-hidden mobile-zoom-wrapper">
        <img class="w-full h-full object-cover mobile-zoom-img" src="${img.src}" alt="${_currentProduct?.name || ''} - ${img.label}" loading="${i === 0 ? 'eager' : 'lazy'}" style="transform-origin: center center; transition: transform 0.2s ease-out; cursor: zoom-in;" />
      </div>`
    ).join('');

    // Bind mobile pinch & double tap zoom listeners (Amazon style)
    galDest.querySelectorAll('.mobile-zoom-wrapper').forEach(wrapper => {
      const img = wrapper.querySelector('.mobile-zoom-img');
      let lastTap = 0;
      let isZoomed = false;
      let touchStartDist = 0;
      let startScale = 1;
      let currentScale = 1;

      if (img) {
        img.style.willChange = 'transform';
      }

      // Double Tap to toggle Zoom
      wrapper.addEventListener('touchend', (e) => {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if (tapLength < 300 && tapLength > 0) {
          isZoomed = !isZoomed;
          if (img) {
            img.style.transition = 'transform 0.2s ease-out';
            if (isZoomed) {
              img.style.transform = 'scale(2.5)';
              galDest.style.overflowX = 'hidden'; // Lock swiping while zoomed
            } else {
              img.style.transform = 'scale(1)';
              galDest.style.overflowX = 'auto';
              currentScale = 1;
            }
          }
          e.preventDefault();
        }
        lastTap = currentTime;
      });

      // Pinch to Zoom
      wrapper.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          if (img) img.style.transition = 'none';
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          startScale = currentScale;
        }
      }, { passive: true });

      wrapper.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && img) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const factor = dist / touchStartDist;
          currentScale = Math.min(Math.max(startScale * factor, 1), 4);
          img.style.transition = 'none';
          img.style.transform = `scale(${currentScale})`;
          if (currentScale > 1) {
            galDest.style.overflowX = 'hidden'; // Lock swiping while zoomed
          } else {
            galDest.style.overflowX = 'auto';
          }
        }
      }, { passive: true });
    });

    const dotsDest = document.getElementById('galleryDotsMobile');
    if (dotsDest) {
      dotsDest.innerHTML = _galleryImages.map((_, i) =>
        `<button class="gallery-dot ${i === _selectedGalleryIndex ? 'active' : ''}" data-dot-idx="${i}" onclick="selectMobileGalleryImage(${i})"></button>`
      ).join('');
    }

    if (!galDest._hasScrollListener) {
      galDest._hasScrollListener = true;
      let scrollTimeout;
      galDest.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
          const w = galDest.offsetWidth;
          if (w > 0) {
            const idx = Math.round(galDest.scrollLeft / w);
            _selectedGalleryIndex = idx;
            const dots = dotsDest.querySelectorAll('.gallery-dot');
            dots.forEach((d, i) => d.classList.toggle('active', i === idx));
          }
        }, 80);
      }, { passive: true });
    }
  }

  // Tabs syncing (Specs and Shipping)
  const specsDest = document.getElementById('productDetailsContentMobile');
  const specsSrc = document.getElementById('productDetailsContent');
  if (specsDest && specsSrc) specsDest.innerHTML = specsSrc.innerHTML;

  const shipDest = document.getElementById('shippingContentMobile');
  const shipSrc = document.getElementById('shippingContent');
  if (shipDest && shipSrc) shipDest.innerHTML = shipSrc.innerHTML;

  // Options Mobile
  const colSrc = document.getElementById('colorOptions');
  const colDest = document.getElementById('colorOptionsMobile');
  const colSel = document.getElementById('colorSelectorMobile');
  if (colSel && colSrc && colDest) {
    colSel.classList.toggle('hidden', document.getElementById('colorSelector').classList.contains('hidden'));
    colDest.innerHTML = colSrc.innerHTML;
  }

  const sizeSrc = document.getElementById('sizeOptions');
  const sizeDest = document.getElementById('sizeOptionsMobile');
  const sizeSel = document.getElementById('sizeSelectorMobile');
  if (sizeSel && sizeSrc && sizeDest) {
    sizeSel.classList.toggle('hidden', document.getElementById('sizeSelector').classList.contains('hidden'));
    sizeDest.innerHTML = sizeSrc.innerHTML;
  }

  // Stock mobile
  const stockSrc = document.getElementById('stockBadge');
  const stockDest = document.getElementById('stockStatusMobile');
  if (stockSrc && stockDest) {
    stockDest.innerHTML = stockSrc.outerHTML;
  }

  // Update sticky bottom switcher state
  updateActionPillsState();
}



// ── Firebase load ──
async function loadProduct() {
  const urlParams = new URLSearchParams(window.location.search);
  const productId = urlParams.get('id');

  if (!productId) {
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    document.querySelector('#errorState p').textContent = 'No product specified. Please navigate from the shop page.';
    return;
  }

  let _rendered = false;
  const _safety = setTimeout(() => {
    if (!_rendered) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.querySelector('#errorState p').textContent = 'Product load timed out. Tap Retry.';
    }
  }, 10000);

  try {
    if (typeof firebase === 'undefined') throw new Error('Firebase SDK not loaded');
    const db = firebase.firestore();
    db.collection('products').doc(productId).onSnapshot((docSnap) => {
      clearTimeout(_safety);
      if (!docSnap.exists) {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('errorState').classList.remove('hidden');
        document.querySelector('#errorState p').textContent = 'Product not found.';
        return;
      }
      const productData = docSnap.data();
      try {
        renderProduct(productData, docSnap.id);
        _rendered = true;
      } catch(renderErr) {
        console.error('[PDP] renderProduct error:', renderErr);
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('errorState').classList.remove('hidden');
        document.querySelector('#errorState p').textContent = 'Display error. Please tap Retry.';
      }
    }, (error) => {
      clearTimeout(_safety);
      console.error('[PDP] load error:', error);
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.querySelector('#errorState p').textContent = 'Could not load product. Please check your connection.';
    });
  } catch (error) {
    clearTimeout(_safety);
    console.error('[PDP] load initialization error:', error);
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    document.querySelector('#errorState p').textContent = 'Could not initialize product load. Please check your connection.';
  }

  loadRelatedProducts(productId);
}

// ── Related products from Firestore ──
async function loadRelatedProducts(currentProductId) {
  const section = document.getElementById('relatedSection');
  const container = document.getElementById('relatedProducts');
  const title = document.getElementById('relatedTitle');

  try {
    if (typeof firebase === 'undefined') return;
    const db = firebase.firestore();
    let related = [];

    if (_currentProduct?.relatedProducts && Array.isArray(_currentProduct.relatedProducts)) {
      for (const rid of _currentProduct.relatedProducts.slice(0, 8)) {
        try {
          const doc = await db.collection('products').doc(String(rid)).get();
          if (doc.exists && doc.id !== currentProductId) related.push({ ...doc.data(), _id: doc.id });
        } catch(e) {}
      }
    }

    if (related.length < 4 && _currentProduct?.categorySlug) {
      const snap = await db.collection('products').where('categorySlug', '==', _currentProduct.categorySlug).limit(6).get();
      snap.forEach(doc => {
        if (doc.id !== currentProductId && !related.some(r => r._id === doc.id)) {
          related.push({ ...doc.data(), _id: doc.id });
        }
      });
    }

    if (related.length < 3) {
      const snap = await db.collection('products').limit(8).get();
      snap.forEach(doc => {
        if (doc.id !== currentProductId && !related.some(r => r._id === doc.id)) {
          related.push({ ...doc.data(), _id: doc.id });
        }
      });
    }

    if (related.length > 0) {
      title.textContent = 'You May Also Love';
      container.innerHTML = related.slice(0, 6).map(p => {
        const img = p.images?.productImage || p.image || p.imageUrl || '';
        const pUrl = `product.html?id=${p._id}`;
        return `<a href="${pUrl}" class="snap-start shrink-0 w-[240px] block">
          <div class="aspect-[4/5] bg-surface-container mb-3 overflow-hidden">
            ${isUsableUrl(img) ? `<img class="w-full h-full object-cover active:scale-105 transition-transform duration-500" src="${img}" alt="${p.name || ''}" loading="lazy" />` : `<div class="w-full h-full bg-surface-container flex items-center justify-center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 13L2 9z"/><path d="M2 9h20"/></svg></div>`}
          </div>
          <p class="font-jost text-[14px] uppercase tracking-wide mb-1">${p.name || 'Product'}</p>
          <p class="font-jost text-[#9F4C67]">${formatPrice(p.price)}</p>
        </a>`;
      }).join('');
      section.classList.remove('hidden');

      // Render mobile related products
      const mobileContainer = document.getElementById('relatedProductsMobile');
      const mobileSection = document.getElementById('relatedSectionMobile');
      if (mobileContainer && mobileSection) {
        mobileContainer.innerHTML = related.slice(0, 4).map(p => {
          const img = p.images?.productImage || p.image || p.imageUrl || '';
          const pUrl = `product.html?id=${p._id}`;
          const wl = getWishlist();
          const saved = wl.includes(p._id);
          const hasDiscount = p.oldPrice && Number(p.oldPrice) > Number(p.price);
          const oldPriceVal = Number(p.oldPrice || p.compareAtPrice || p.mrp || (p.price ? Math.ceil(Number(p.price) * 1.28) : 0));
          return `
            <div class="snap-start shrink-0 mobile-related-card" style="width: calc(72vw); scroll-snap-align: start;">
              <div class="img-frame">
                <a href="${pUrl}">
                  ${isUsableUrl(img) ? `<img class="w-full h-full object-cover" src="${img}" alt="${p.name || ''}" loading="lazy" />` : `<div class="w-full h-full flex items-center justify-center bg-gray-100">🌸</div>`}
                </a>
                <button class="wish-btn" onclick="toggleRelatedWishlist(event, '${p._id}')" data-wish-id="${p._id}">
                  ${saved 
                    ? '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' 
                    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'}
                </button>
              </div>
              <div class="info">
                <h4 class="name"><a href="${pUrl}">${p.name || 'Product'}</a></h4>
                <div class="price-row">
                  <span>${formatPrice(p.price)}</span>
                  ${hasDiscount || oldPriceVal > p.price ? `<span class="old-price">${formatPrice(oldPriceVal)}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');
        mobileSection.classList.remove('hidden');
      }
    } else {
      section.classList.add('hidden');
      const mobileSection = document.getElementById('relatedSectionMobile');
      if (mobileSection) mobileSection.classList.add('hidden');
    }
  } catch (e) {
    section.classList.add('hidden');
  }
}

window.toggleMobileFooterAccordion = function(btn) {
  const item = btn.parentElement;
  const content = item.querySelector('.accordion-content');
  const chevron = btn.querySelector('.chevron-icon');
  const isOpen = item.classList.contains('accordion-open');
  
  if (isOpen) {
    item.classList.remove('accordion-open');
    content.style.maxHeight = '0px';
    chevron.style.transform = 'rotate(0deg)';
  } else {
    item.classList.add('accordion-open');
    content.style.maxHeight = content.scrollHeight + 'px';
    chevron.style.transform = 'rotate(180deg)';
  }
};
