<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Checkout Review – Chic Charms</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root{--surface:#fff8f7;--card:#fff;--soft:#f6eceb;--text:#1f1a1b;--muted:#534346;--line:#d7c1c5;--primary:#8e4559;--head:Georgia,'Times New Roman',serif;--body:'Jost',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--text);font-family:var(--body)}.page{min-height:100dvh;padding:100px 20px 110px;max-width:560px;margin:0 auto}.top{position:fixed;top:0;left:0;right:0;height:76px;background:rgba(255,248,247,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;z-index:20}.back{position:absolute;left:14px;border:0;background:transparent;font-size:30px;color:var(--primary)}.brand{font-family:var(--head);font-weight:700;letter-spacing:.16em;color:var(--primary);font-size:24px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--primary);font-weight:800}.title{font-family:var(--head);font-size:36px;line-height:1.15;margin:10px 0 8px}.sub{color:var(--muted);line-height:1.65;margin:0 0 26px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 14px 40px rgba(144,71,91,.08)}.card h2{font-family:var(--head);font-size:22px;margin:0 0 16px}.item,.row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px dashed rgba(215,193,197,.75)}.item:last-child,.row:last-child{border-bottom:0}.muted{color:var(--muted)}.price,.strong{font-weight:800;color:var(--text);white-space:nowrap}.discount{color:var(--primary);font-weight:900}.coupon-card{background:linear-gradient(135deg,#fdf2f5,#faf5f2);border-color:rgba(142,69,89,.16)}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;border:1px solid rgba(142,69,89,.18);padding:3px 8px;border-radius:8px;font-weight:900}.total{align-items:center;border-top:1px solid var(--line);border-bottom:0;margin-top:6px;padding-top:16px}.total .price{font-family:var(--head);font-size:28px;color:var(--primary)}.footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,248,247,.98);border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom));z-index:30}.btn{height:56px;width:100%;border:0;border-radius:16px;background:var(--primary);color:#fff;font-weight:900;letter-spacing:.04em;font-size:15px}.empty{text-align:center;padding:42px 24px}.empty a{color:var(--primary);font-weight:800}@media (min-width:769px){.page{max-width:860px}.desktop-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}.footer{max-width:860px;left:50%;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0}}
  </style>
</head>
<body>
  <header class="top"><button class="back" onclick="history.length>1?history.back():location.href='delivery-method.html'">‹</button><div class="brand">CHIC CHARMS</div></header>
  <main class="page"><p class="eyebrow">Checkout</p><h1 class="title">Review your order</h1><p class="sub">Confirm your bag and campus benefit before payment.</p><div id="empty" class="card empty" style="display:none"><p>Your cart is empty.</p><a href="index.html#bestsellers">Browse best sellers →</a></div><div class="desktop-grid" id="reviewGrid"><section class="card"><h2>Items</h2><div id="items"></div></section><aside><section class="card coupon-card" id="couponSection" style="display:none"><h2>Campus Discount</h2><div class="row"><span>Campus Discount</span><span class="discount" id="discountText">-₹50</span></div><div class="row"><span>Coupon</span><span class="code" id="couponCodeText"></span></div></section><section class="card"><h2>Payment Summary</h2><div id="summary"></div></section></aside></div></main><footer class="footer"><button class="btn" id="continueBtn">Continue to Payment</button></footer>
  <script src="coupon-session.js"></script>
  <script>
    const $=id=>document.getElementById(id); let activeCoupon=null; const money=n=>'₹'+Number(n||0).toLocaleString('en-IN'); const escape=s=>String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); function cart(){try{return JSON.parse(localStorage.getItem('cart'))||[]}catch(e){return[]}} function render(){const c=cart(); if(!c.length){$('empty').style.display='block';$('reviewGrid').style.display='none';return} $('empty').style.display='none';$('reviewGrid').style.display='grid';$('items').innerHTML=c.map(i=>'<div class="item"><span>'+escape(i.name)+(Number(i.quantity||1)>1?' ×'+Number(i.quantity):'')+'</span><span class="price">'+money(Number(i.price||0)*Number(i.quantity||1))+'</span></div>').join(''); const subtotal=c.reduce((s,i)=>s+Number(i.price||0)*Number(i.quantity||1),0); const shipping=subtotal>=399?0:49; const discount=window.ChicCoupon.getDiscount(activeCoupon); const total=Math.max(0,subtotal+shipping-discount); $('couponSection').style.display=discount>0?'block':'none'; if(discount>0){$('discountText').textContent='-'+money(discount);$('couponCodeText').textContent=activeCoupon.couponCode;} $('summary').innerHTML='<div class="row"><span class="muted">Subtotal</span><span class="strong">'+money(subtotal)+'</span></div><div class="row"><span class="muted">Shipping</span><span class="strong">'+(shipping===0?'Free':money(shipping))+'</span></div>'+(discount>0?'<div class="row"><span class="discount">Campus Discount</span><span class="discount">-'+money(discount)+'</span></div>':'')+'<div class="row total"><span class="strong">Total</span><span class="price">'+money(total)+'</span></div>'; }
    async function init(){ activeCoupon=window.ChicCoupon.getStoredCoupon(); render(); try{ activeCoupon=await window.ChicCoupon.fetchSession(); }catch(e){ activeCoupon=null; } render(); }
    $('continueBtn').addEventListener('click',()=>{location.href='checkout.html'}); init();
  </script>
</body>
</html>
